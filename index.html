  SCRIPT_RULES.never.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul></div><h3 class="sec">En español</h3><ul>';
  SCRIPT_RULES.spanish.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; });
  h += '</ul><h3 class="sec">When you walk away</h3><ul>';
  SCRIPT_RULES.after.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul><div class="warn"><b>The permit.</b> Knocking a cold door to sell work is a “home solicitation sale”. The permit comes from the <b>Clerk of Court in that county</b> — Brevard for every route but Fort Pierce, St. Lucie for that one — and a contractor is not on the exemption list. An invited visit is.<br><span class="src"><a href="http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0501/Sections/0501.022.html" target="_blank" rel="noopener">F.S. 501.022</a> · <a href="https://www.brevardclerk.us/home-solicitation-permit" target="_blank" rel="noopener">Brevard Clerk</a></span></div>';
  return h;
}

/* ---------- paper ---------- */
/* ---------- already re-roofed: the doors we took off the walk ---------- */
function rrBanner(){
  if(!ROOFS.loaded) return '';
  var r = S.route;
  if(COUNTY_BLIND[r.id]){
    return '<div class="warn" style="margin-bottom:10px"><b>Roof history is not public here.</b> '+
      esc(r.town)+' issues its own permits, so we cannot tell which of these doors already got a new roof. '+
      'Every door is still on the list — check the shingles yourself from the street.</div>';
  }
  var done = roofedCount(S.doors);
  if(!done){
    return '<div class="warn" style="margin-bottom:10px"><b>Nobody on this route has pulled a roof permit since 2021.</b> '+
      'Every door is live. Read that two ways: either the street is untouched, or the damage is not being claimed yet.</div>';
  }
  var pct = Math.round(done/S.doors.length*100);
  var recent5 = 0;
  S.doors.forEach(function(p){ if(p.rr && ymAgoYears(p.rr) <= 3) recent5++; });
  return '<div class="warn" style="margin-bottom:10px">'+
    '<b>'+done+' of '+S.doors.length+' doors ('+pct+'%) already have a new roof.</b> '+
    recent5+' of those were done in the last three years. '+
    (S.skipRR ? 'They are <b>off the walk list</b> — you are seeing the '+(S.doors.length-done)+' that can still say yes.'
              : 'They are <b>still on the list</b>.')+
    '<br><button class="btn" style="margin-top:8px" onclick="toggleSkipRR()">'+
    (S.skipRR ? 'Put them back on the list' : 'Take them off the list')+'</button>'+
    '<br><span style="font-size:11px;color:#5b667c">County record only, and only back to 1 January 2021 '+
    '(with a gap from 1 Jan to 14 Mar 2026). An older roof looks like no roof to this app.</span></div>';
}

/* ---------- the proof card: point, do not talk ---------- */
function proofHtml(){
  var r = S.route;
  if(!ROOFS.loaded) return '<div class="loading">Loading the county permit file…</div>';
  if(COUNTY_BLIND[r.id]){
    return '<h3 class="sec">No proof card for this route</h3>'+
      '<div class="warn"><b>' + esc(r.town) + ' issues its own permits and does not publish them.</b> '+
      'The county file only covers unincorporated Brevard and Grant-Valkaria, so there is nothing to point at here — '+
      'not because the street is quiet, but because the record is closed. '+
      'Use the storm date and the radar on <b>The area</b> tab instead, and knock this one as a question.</div>'+
      '<p class="sub">If you want this street covered, the fix is a public-records request to the city. Ask for permits issued in the last 90 days with the contractor name.</p>';
  }
  var list = proofFor(vis());
  if(!list.length){
    return '<h3 class="sec">Nothing going up here yet</h3>'+
      '<div class="warn">No roof permit within a short walk of this block in the last '+PROOF_DAYS+' days. '+
      '<b>That is real information.</b> Either the street took less than you think, or nobody has filed yet. '+
      'Knock it as a question, and do not tell anyone their neighbours are getting roofs.</div>';
  }
  var n30 = list.filter(function(x){ return x.age <= 30; }).length;
  var see = list.filter(function(x){ return x.ft <= 900; });
  var groups = proofByStreet(list);
  var here = titleCase(ownStreet(vis()) || S.route.name);
  var h = '<h2 class="big">'+list.length+' roof'+(list.length===1?'':'s')+' going up around this block</h2>'+
    '<p class="sub">Within a '+PROOF_MI+'-mile walk · '+n30+' in the last 30 days · '+
    see.length+' close enough to see from the street'+
    (list.filter(function(x){ return x.pend===1; }).length ? ' · <b style="color:#e07b00">'+
      list.filter(function(x){ return x.pend===1; }).length+' still open</b>' : '')+'.</p>'+
    '<button class="btn sand" onclick="printProof()">Print this card</button>'+
    '<div class="warn"><b>Say it like this.</b> “I’m working on '+esc(here)+' today. '+
    'The county shows '+(n30 || list.length)+' roof permit'+((n30||list.length)===1?'':'s')+' pulled within half a mile '+
    (n30 ? 'in the last month' : 'since the March hail')+'. '+
    'I’m offering the neighbours a free look at theirs — no charge, no obligation.”<br><br>'+
    '<b>Never say</b> those houses had damage, never say what a carrier will pay, and never let anyone think Covenant did that work. '+
    'You are pointing at a public record, nothing more.</div>';
  var openHere = list.filter(function(x){ return x.pend === 1; });
  if(openHere.length){
    h += '<h3 class="sec">Going on right now</h3>'+
      '<p class="sub">Permit pulled, roof not signed off. The crew is coming, or is there.</p>';
    openHere.slice(0,10).forEach(function(p){
      h += '<p class="sub" style="margin:6px 0 0"><b style="color:#e07b00">'+esc(p.ad)+'</b> \u2014 permit '+ago(p.age)+
           ' &middot; '+p.ft+' ft'+(p.who ? ' &middot; '+esc(p.who) : '')+'</p>';
    });
  }
  if(see.length){
    h += '<h3 class="sec">Close enough to point at</h3><div class="chips">';
    see.slice(0,14).forEach(function(p){
      h += '<span class="chip'+(p.age<=30?' hot':'')+'">'+esc(p.ad)+' · '+p.ft+' ft · '+ago(p.age)+'</span>';
    });
    h += '</div>';
  }
  groups.forEach(function(g){
    h += '<h3 class="sec">'+esc(g.street)+' — '+g.rows.length+'</h3>';
    g.rows.slice(0,8).forEach(function(p){
      h += '<p class="sub" style="margin:6px 0 0"><b>'+esc(p.ad)+'</b> — '+ago(p.age)+' · '+p.ft+' ft'+
           (p.who ? ' · '+esc(p.who) : '')+(p.val ? ' · about $'+(p.val*1000).toLocaleString() : '')+'</p>';
    });
    if(g.rows.length > 8) h += '<p class="sub" style="margin:4px 0 0">…and '+(g.rows.length-8)+' more on this street.</p>';
  });
  h += '<p class="src">Source: Brevard County Accela, “Permits Issued Details”, permits issued 15 March – 13 September 2026. '+
       'Unincorporated Brevard and Grant-Valkaria only. Every one of these is somebody else’s job.</p>';
  return h;
}
function proofCardHtml(doors, label){
  var list = proofFor(doors).slice().sort(function(a,b){ return a.ft - b.ft; });
  if(!list.length) return '';
  var n30 = list.filter(function(x){ return x.age <= 30; }).length;
  var h = '<p class="pl"><b>PROOF — '+list.length+' roof permits within '+PROOF_MI+' mile of these doors, '+
    n30+' in the last 30 days. County record. Point at them; do not claim them.</b></p>'+
    '<table class="sheet"><tr><th>Address</th><th>How far</th><th>Permit issued</th><th>Roofer</th></tr>';
  list.slice(0,10).forEach(function(p){
    h += '<tr><td>'+esc(p.ad)+(p.pend===1?' <b>(OPEN)</b>':'')+'</td><td>'+p.ft+' ft</td><td>'+ago(p.age)+'</td><td>'+esc(p.who||'')+'</td></tr>';
  });
  return h + '</table>';
}
function printProof(){
  var list = proofFor(vis()), r = S.route;
  var h = '<div class="pg"><h2>Proof card — '+esc(r.name)+', '+esc(r.town)+'</h2>'+
    '<p class="pl">Covenant Builders · CBC1253676 · (772) 473-7115 · '+
    'These are other companies’ permits, pulled from Brevard County’s public record. '+
    'Never say a house had damage before you have been on the roof, and never say what a carrier will pay.</p>'+
    (proofCardHtml(vis()) || '<p class="pl">No roof permits within '+PROOF_MI+' mile in the last '+PROOF_DAYS+' days.</p>')+
    '</div>';
  document.getElementById('print').innerHTML = h;
  window.print();
}

function sheetFor(b, i){
  var r = S.route, a = AREAS.filter(function(x){ return x.id===r.area; })[0], pl = plan(b);
  var h = '<div class="pg"><h2>'+esc(r.name)+' — '+esc(r.town)+
    (S.blocks.length>1 ? ' — block '+(i+1)+' of '+S.blocks.length : '')+'</h2>'+
    '<p class="pl">'+esc(a.name)+' · '+esc(a.when)+' · '+fileText(r, true)+' · '+
    b.length+' doors · '+pl.pace+' an hour · knock '+clock(pl.start)+' to '+clock(pl.end)+' · dark at '+clock(pl.dark)+'</p>'+
    '<p class="pl">Covenant Builders · CBC1253676 · (772) 473-7115 · never say a roof has damage before you have been on it · the carrier decides the claim</p>'+
    proofCardHtml(b)+
    '<table class="sheet"><tr><th>#</th><th>Address</th><th>Owner of record</th><th>Built</th><th>Knock</th><th>Out</th><th>Name / number / notes</th></tr>';
  b.forEach(function(p,j){
    h += '<tr><td>'+(j+1)+'</td><td>'+esc(p.ad)+'</td><td>'+esc(p.own||'')+'</td><td>'+(p.yr||'')+'</td><td></td><td></td><td></td></tr>';
  });
  return h + '</table><p class="pl">Owner and year: Florida Dept. of Revenue 2025 tax roll. House age, not roof age.</p></div>';
}
function renderPrint(all){
  var out = '';
  if(all && S.blocks.length > 1) S.blocks.forEach(function(b,i){ out += sheetFor(b,i); });
  else out = sheetFor(vis(), S.bi);
  document.getElementById('print').innerHTML = out;
}
function printSheet(all){ renderPrint(all); window.print(); }

/* ---------- keep working when the signal does not ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(reloaded) return; reloaded = true; location.reload();
    });
  });
}

/* ---------- go ---------- */
buildMap();
initSheet();
goOverview();
</script>
