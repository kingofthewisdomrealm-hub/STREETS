<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12182B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Street Book — Covenant Builders</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Street Book">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.css">
<style>
:root{
  --navy:#12182B; --sand:#c4a574; --word:#e9e7e2; --gold:#d4a24c;
  --ink:#1d2433; --ink2:#5b667c; --line:#e3e6ec; --card:#ffffff; --wash:#f5f6f8;
  --red:#c1524a; --green:#3f7d52; --blue:#1a73e8;
  --sheet-peek:132px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--wash);color:var(--ink);
  font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.disp,h1,h2,h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;margin:0}
button{font-family:inherit}

/* ---------- the map is the app ---------- */
#map{position:fixed;inset:0;z-index:0;background:#e8ebef;touch-action:none;overscroll-behavior:none}
#map canvas{touch-action:none}
.maplibregl-ctrl-attrib{font-size:9px}
.maplibregl-ctrl-bottom-right{margin-bottom:2px}
.maplibregl-ctrl-bottom-left{margin-bottom:calc(14px + env(safe-area-inset-bottom));margin-left:10px}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl-group button{width:42px;height:42px}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl-group button .maplibregl-ctrl-icon{background-size:24px}
.maplibregl-ctrl-geolocate{display:none !important}
.maplibregl-popup-content{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;
  box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:260px}
.maplibregl-popup-content b{font-size:15px}
.maplibregl-user-location-dot, .maplibregl-user-location-accuracy-circle{z-index:5}

/* ---------- floating top bar ---------- */
#topbar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:1000;
  display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--word);
  border-radius:12px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
#topbar .crown{flex:none}
#tb-title{flex:1;min-width:0}
#tb-title b{display:block;font-size:14.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb-title small{display:block;font-size:11px;color:#a9b2c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backbtn{display:none;background:none;border:0;color:var(--word);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
.filters{position:fixed;top:calc(60px + env(safe-area-inset-top));left:0;right:0;z-index:999;
  display:flex;gap:6px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-size:12.5px;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14);cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--navy);color:var(--word);border-color:var(--navy)}

/* ---------- floating round buttons ---------- */
.fabs{position:fixed;right:10px;z-index:999;display:flex;flex-direction:column;gap:10px;
  bottom:calc(76px + env(safe-area-inset-bottom))}
.fab{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;color:var(--ink);padding:0}
.fab.on{background:var(--navy);color:var(--word);border-color:var(--navy)}

/* ---------- layer picker ---------- */
#layers{position:fixed;right:10px;bottom:calc(130px + env(safe-area-inset-bottom));z-index:1001;display:none;
  background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.28);padding:8px;width:190px}
#layers b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:2px 4px 6px}
#layers button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 8px;border-radius:8px;
  font-size:14px;color:var(--ink);cursor:pointer}
#layers button.on{background:var(--wash);font-weight:600}

/* ---------- the bottom sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1002;background:var(--card);
  border-radius:16px 16px 0 0;box-shadow:0 -3px 20px rgba(0,0,0,.20);
  height:88vh;transform:translateY(100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;touch-action:none}
#sheet.peek{transform:translateY(calc(88vh - var(--sheet-peek)))}
#sheet.half{transform:translateY(45vh)}
#sheet.full{transform:translateY(0)}
#opensheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:1003;display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--word);
  border:0;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;
  box-shadow:0 3px 14px rgba(0,0,0,.35);cursor:pointer}
#opensheet span{color:var(--sand);font-weight:400;font-size:12.5px}
#grab{padding:8px 0 4px;cursor:grab;flex:none}
#grab i{display:block;width:38px;height:4px;border-radius:2px;background:#c9cfdb;margin:0 auto}
#sheethead{padding:0 16px 8px;flex:none}
#sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + env(safe-area-inset-bottom));flex:1}

/* ---------- content bits ---------- */
h2.big{font-size:20px;margin:2px 0 2px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 8px}
p{font-size:14px;line-height:1.5;margin:8px 0}
ul{margin:6px 0;padding-left:20px}li{font-size:14px;line-height:1.45;margin:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--wash);border:1px solid var(--line);color:var(--ink)}
.chip.hot{background:var(--navy);color:var(--word);border-color:var(--navy)}
.chip.warn{background:#fdeceb;border-color:#f3c9c6;color:#8d3b35}
.chip.radar{background:#eaf3ec;border-color:#c5dccb;color:#2f5e3f}
.btn{background:var(--wash);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:9px 12px;font-size:13.5px;cursor:pointer;margin:0 6px 6px 0}
.btn.prime{background:var(--navy);color:var(--word);border-color:var(--navy);font-weight:600}
.btn.sand{background:var(--sand);color:var(--navy);border-color:var(--sand);font-weight:600}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}
.rowbtn:last-child{border-bottom:0}
.rowdot{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff}
.rowtxt{flex:1;min-width:0}
.rowtxt b{display:block;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowtxt small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowgo{color:var(--ink2);font-size:20px;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:2px 0 4px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);
  padding:10px 2px;font-size:13.5px;cursor:pointer}
.tab.on{color:var(--navy);border-bottom-color:var(--sand);font-weight:600}
.pane{display:none}.pane.on{display:block}
.plan{background:#fff8ec;border:1px solid #f0dfc0;border-radius:10px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.55}
.warn{background:#fdeceb;border:1px solid #f3c9c6;border-radius:10px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.5}
.note{font-size:12px;color:var(--ink2);margin:8px 0;line-height:1.45}
.src{font-size:11px;color:var(--ink2)}
.src a{color:var(--ink2)}
h3.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:16px 0 4px}
.door{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}
.door .n{width:24px;color:var(--ink2);font-size:11.5px;flex:none;text-align:right}
.door .ad{flex:1;min-width:0}
.door .ad b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door .ad small{color:var(--ink2);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yr{font-size:11.5px;padding:2px 6px;border-radius:4px;flex:none}
.y0{background:#fbe3e1;color:#8d3b35}.y1{background:#fbeed4;color:#7a5a15}
.y2{background:#f1e8d9;color:#6b5733}.y3{background:#e9ecf1;color:#5b667c}
.mk{display:flex;gap:5px;flex:none}
.mk button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);
  font-size:15px;font-weight:700;cursor:pointer}
/* the marks wear a coat of paint you can read at arm's length, in the sun,
   through a phone screen you cannot see. Contrast first, taste second. */
.mk button.on.k{background:#0B6E2D;border-color:#0B6E2D;color:#fff;font-weight:900}
.mk button.on.n{background:#5B667C;border-color:#5B667C;color:#fff;font-weight:900}
.mk button.on.l{background:#FFB300;border-color:#12182B;color:#12182B;font-weight:900;box-shadow:0 0 0 2px #FFB30055}
.door.mk-k{background:#E4F3E9;box-shadow:inset 5px 0 0 #0B6E2D;padding-left:9px;border-radius:7px}
.door.mk-n{background:#EFF1F5;box-shadow:inset 5px 0 0 #5B667C;padding-left:9px;border-radius:7px;opacity:.62}
.door.mk-l{background:#FFF3D1;box-shadow:inset 5px 0 0 #FFB300;padding-left:9px;border-radius:7px}
.door.mk-l .ad b{color:#7a5400}
.chip.knock{background:#0B6E2D;color:#fff;border-color:#0B6E2D;font-weight:700}
.chip.lead{background:#FFB300;color:#12182B;border-color:#12182B;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink2);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.loading{padding:24px 0;text-align:center;color:var(--ink2);font-size:13.5px}

/* ---------- map marks ---------- */
.pin{background:var(--navy);color:var(--word);border:2px solid #fff;border-radius:999px;
  padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.fp{background:#6b4f2a}
.pin small{display:block;font-weight:400;font-size:10px;color:#c9cfdb}
.stormpin{background:var(--gold);color:#2a2107;border:2px solid #fff;border-radius:999px;padding:4px 9px;
  font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.yardpin{background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:4px 9px;
  font-size:11px;font-weight:700;white-space:nowrap}

/* ---------- print ---------- */
#print{display:none}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #map,#topbar,.filters,.fabs,#layers,#sheet,#opensheet{display:none !important}
  #print{display:block !important}
  #print .pg{break-after:page;page-break-after:always}
  #print .pg:last-child{break-after:auto;page-break-after:auto}
  #print h2{margin:0 0 4px;font-size:15px}
  #print .pl{font-size:10.5px;margin:2px 0 6px;color:#333}
  table.sheet{width:100%;border-collapse:collapse;font-size:10.5px}
  table.sheet th,table.sheet td{border:1px solid #444;padding:3px 4px;text-align:left}
  table.sheet td:nth-child(5),table.sheet td:nth-child(6){width:34px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <button id="backbtn" onclick="goOverview()" aria-label="Back">&#8592;</button>
  <svg class="crown" width="16" height="14" viewBox="0 0 147 121" aria-hidden="true">
    <path d="M11,116 L2,55 L45,66 L73,3 L101,66 L145,55 L136,116 Z" fill="none" stroke="#c4a574" stroke-width="14" stroke-linejoin="miter"/>
  </svg>
  <div id="tb-title"><b>The Street Book</b><small>Covenant Builders &middot; where the storm hit</small></div>
</div>

<div class="filters" id="filters"></div>

<div class="fabs">
  <button class="fab" id="layerbtn" onclick="toggleLayers()" title="Map type">&#9707;</button>
  <button class="fab" id="gpsfab" onclick="locateMe()" title="Where am I">&#10021;</button>
</div>

<div id="layers">
  <b>Map type</b>
  <button data-b="map" onclick="setBase('map')">Map</button>
  <button data-b="sat" onclick="setBase('sat')">Satellite</button>
  <button data-b="hyb" onclick="setBase('hyb')">Satellite + street names</button>
  <button data-b="naip" onclick="setBase('naip')">Aerial photo (USGS)</button>
</div>

<button id="opensheet" onclick="openSheet()">Routes <span id="pillsub">13 walks</span></button>

<div id="sheet" class="half">
  <div id="grab"><i></i></div>
  <div id="sheethead"></div>
  <div id="sheetbody"></div>
</div>

<div id="print"></div>
<script>

 open:{
  history:[
   {t:'You are standing on a celery farm. Andrew Duda, a Slovak immigrant, started the family firm in 1926 with one cash crop \u2014 celery. In the early 1940s his three sons bought a 43,000-acre tract in Brevard County. That tract is Viera. The master plan for the community was not announced until 1989, which means the ground under these houses was farmed for half a century first.', s:'https://viera.com/live-here/our-beginnings', sn:'The Viera Company'},
   {t:'Merritt Island first shows up on a map in 1605 and takes its name from a Spanish land grant to a man called Merritt. Douglas Dummitt found wild citrus here, planted more, and started shipping fruit north in 1828 \u2014 he is the father of the Indian River citrus trade you sell against every day.', s:'https://www.florida-backroads-travel.com/merritt-island-florida.html', sn:'Florida Backroads Travel'},
   {t:'The space race built these streets. Brevard County went from 111,435 people in 1960 to 230,006 in 1970 \u2014 the fastest-growing county in the United States that decade, and most of it landed on Merritt Island. Between 1962 and 1964 NASA bought more than 80,000 acres and wiped three towns off the map: Allenhurst, Clifton and Courtenay.', s:'https://www.florida-backroads-travel.com/merritt-island-florida.html', sn:'Florida Backroads Travel'},
   {t:'Port St John nearly doubled between the last two censuses \u2014 12,267 people in 2010, 23,474 in 2020. It is not a city. Residents voted incorporation down in November 2002, 73 per cent to 27, and it has stayed unincorporated ever since. That is exactly why the county permits it and you can see the records.', s:'https://en.wikipedia.org/wiki/Port_St._John,_Florida', sn:'Wikipedia, 2020 Census figures'}
  ],
  legends:[
   {t:'LEGEND \u2014 the bust nobody talks about. After Apollo 11 landed in 1969, employment at Kennedy Space Center fell from 23,500 to 16,500 inside a year and thousands of houses here went into foreclosure. Old-timers on these streets bought at the bottom of that. Do not be the second person that week to knock on a door in a neighbourhood that remembers being abandoned.', s:'https://www.florida-backroads-travel.com/merritt-island-florida.html', sn:'Florida Backroads Travel'},
   {t:'LEGEND \u2014 the street names. Artemis, Diana, Vega, Mercury, Saturn, Venus, Mars. Everybody on the island will tell you the plat was named for the space programme. It reads that way and the timing fits, but treat it as neighbourhood lore, not documented fact \u2014 and let them tell you, do not tell them.', s:'https://www.florida-backroads-travel.com/merritt-island-florida.html', sn:'Context only \u2014 the naming itself is unsourced'}
  ],
  heroes:[
   {t:'Andrew Duda arrived from Slovakia with nothing and started with celery in 1926. Four generations later the family still owns the land and still farms; Viera is what they did with a corner of it. If you want one sentence that lands in this zip code, it is that somebody farmed here first.', s:'https://viera.com/live-here/our-beginnings', sn:'The Viera Company'},
   {t:'Douglas Dummitt planted the first commercial citrus grove on Merritt Island and shipped fruit north starting in 1828, founding the Indian River brand. Two hundred years later that name is still on the fruit.', s:'https://www.florida-backroads-travel.com/merritt-island-florida.html', sn:'Florida Backroads Travel'}
  ],
  landmarks:[
   {t:'Atlantis Elementary in Port St John was named one of the top twelve schools in the country for character, culture and achievement in 2009, and held an A rating from 2000 to 2009. Parents here know that number.', s:'https://en.wikipedia.org/wiki/Port_St._John,_Florida', sn:'Wikipedia'},
   {t:'Viera was named a Top 25 master-planned community in the United States in 2025. People who live here chose it on purpose and they will tell you why.', s:'https://viera.com/live-here/our-beginnings', sn:'The Viera Company'}
  ],
  openers:[
   '\u201cI am working on this street today \u2014 the county shows a few roof permits pulled around here in the last month. Mind if I look at yours from the ground?\u201d',
   '\u201cSomebody told me this was all Duda celery fields before it was Viera. Is that right, or is that just what people say?\u201d',
   '\u201cWere you here for the shuttle days, or did you come after?\u201d',
   '\u201cI noticed a couple of houses on the block getting new roofs. I am not going to tell you yours needs one \u2014 I would just rather look than guess.\u201d'
  ]
 },
 near:{
  history:[
   {t:'Sebastian is named for the river, and the river for San Sebastián. The town grew out of fishing and citrus on the lagoon, and Sebastian Highlands — the grid you are walking — was platted as quarter-acre lots and sold the same way Palm Bay was.', s:'https://www.sebastianchamber.com/our-history/', sn:'Sebastian River Area Chamber'},
   {t:'Twelve miles from the yard is the first national wildlife refuge in the United States. Theodore Roosevelt set Pelican Island aside on 14 March 1903, and Paul Kroegel — a German-born boat builder who had been guarding the birds himself — became its first warden.', s:'https://myfloridahistory.org/date-in-history/march-14-1903/pelican-island-national-wildlife-became-first-national-refuge', sn:'Florida Historical Society'},
   {t:'Fellsmere is a small farming town west of the ridge, and Lakewood Park sits north of Fort Pierce off Kings Highway — both are inside your own service area, which is the whole point of this list.', s:'https://visitindianrivercounty.com/history/', sn:'Visit Indian River County'}
  ],
  legends:[
   {t:'LEGEND — the treasure. The 1715 Spanish plate fleet went down along this coast, and people still walk these beaches after a storm looking for coins. Every family here has a cousin who found one.', s:'https://visitindianrivercounty.com/history/', sn:'Visit Indian River County'}
  ],
  heroes:[
   {t:'Paul Kroegel — the man who stood between the pelicans and the plume hunters, and ended up starting the national refuge system twelve miles from your yard.', s:'https://myfloridahistory.org/date-in-history/march-14-1903/pelican-island-national-wildlife-became-first-national-refuge', sn:'Florida Historical Society'}
  ],
  landmarks:[
   {t:'Pelican Island National Wildlife Refuge — the first one in the country.', s:'https://www.fws.gov/refuge/pelican-island', sn:'US Fish & Wildlife Service'},
   {t:'The Sebastian riverfront, the working boats, and the causeway everybody fishes off.', s:'https://www.sebastianchamber.com/our-history/', sn:'Sebastian Chamber'}
  ],
  openers:[
   'Sebastian: “I am out of Vero — twenty minutes up the road. Were you here when the hail came through in May?”',
   'Fellsmere: “Small town. Does word still get around here faster than the mail?”',
   'Lakewood Park: “I am right down the road in Vero. Did anything come down here in August?”'
  ]
 },
 hail:{
  history:[
   {t:'Malabar was settled in the late 1800s and incorporated in 1962. It had 634 people in 1970 and 2,949 in 2020 — so most of the people you knock on moved in after the town already existed.', s:'https://en.wikipedia.org/wiki/Malabar,_Florida', sn:'Malabar, Florida'},
   {t:'In 2019 the Malabar town council declared the town a sandhill crane sanctuary and made the sandhill crane the official town bird. If a pair of five-foot birds walks across a driveway while you are talking, that is a protected resident.', s:'https://en.wikipedia.org/wiki/Malabar,_Florida', sn:'Malabar, Florida'},
   {t:'Valkaria was supposed to be “Valkyries.” Ernest Svedelius settled north of Grant in 1886 and named it for the Norse figures; the post office misspelled it and the mistake became the name.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'Grant got its post office on 4 August 1891 under postmaster Edwin Nelson, its first school in 1893, and its first train that November. Grant Grocery opened in 1894 and is on the National Register of Historic Places.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'Palm Bay was Tillman until 1925. John Tillman built a wharf at the mouth of Turkey Creek in the late 1870s; the post office opened in 1885; residents renamed the place Palm Bay in the land boom for a palm-lined cove on the lagoon.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'In 1959 the Mackle brothers’ General Development Corporation bought about 41,000 acres west of the Indian River for $1.7 million, platted it as Port Malabar, and sold it by mail — ten dollars down, ten dollars a month, a quarter-acre of Florida. They drained 40,000 acres of swamp and dug 180 miles of canals. GDC filed Chapter 11 in 1990 and three executives were convicted of fraud.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'Bayside Lakes, in the late 1990s, was the first big development in Palm Bay that was not GDC.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'Barefoot Bay is the largest manufactured-home community in Florida — deed restricted, unincorporated, mostly retired, and it runs its own recreation district and its own water and sewer district.', s:'https://en.wikipedia.org/wiki/Barefoot_Bay,_Florida', sn:'Barefoot Bay, Florida'}
  ],
  legends:[
   {t:'LEGEND — the Ais. The people who lived on Turkey Creek for centuries before Ponce de León were gone by about 1760, taken by disease and raids. Their shell mounds are still along the lagoon, and every few years somebody in Palm Bay digs a pool and finds one.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'LEGEND — the ten-dollar lot. Half the retirees in Port Malabar will tell you their parents bought the lot sight unseen from a magazine ad, then flew down to find it under two feet of water. The mail-order sales and the draining are documented; the family version is always better.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'}
  ],
  heroes:[
   {t:'Paul Kroegel — a German-born boat builder from Sebastian who guarded the pelicans on Pelican Island himself, until Theodore Roosevelt made it the first national wildlife refuge in the country on 14 March 1903 and Kroegel became its first warden. Every national wildlife refuge in America started twelve miles from where you are standing.', s:'https://myfloridahistory.org/date-in-history/march-14-1903/pelican-island-national-wildlife-became-first-national-refuge', sn:'Florida Historical Society'},
   {t:'The Bensen and Christensen families — Danish immigrants who fished and farmed Grant in the 1800s. Atley Bensen built a precut yellow-pine cracker house in 1916; the family gave it to the historical society in 1984 and it has been a museum since 1987. Both names are still common on these mailboxes.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'The Grant Seafood Festival volunteers — the longest-running seafood festival on the East Coast, run entirely by volunteers, and the money goes to a scholarship fund. In Grant, “are you working the festival” is a real question.', s:'https://www.grantseafoodfestival.com/information', sn:'Grant Seafood Festival'}
  ],
  landmarks:[
   {t:'Malabar Scrub Sanctuary — county EEL preserve, trails, the scrub jays.', s:'https://www.brevardfl.gov/EELProgram/Sanctuaries/MalabarScrubSanctuary', sn:'Brevard County EEL'},
   {t:'Turkey Creek Sanctuary, Palm Bay — 113 acres, 1.85 miles of boardwalk, given to Audubon and the city in 1978; the Margaret Hames Nature Center opened in 1992.', s:'https://en.wikipedia.org/wiki/Turkey_Creek_Sanctuary', sn:'Turkey Creek Sanctuary'},
   {t:'Grant Historical House — the 1916 Bensen house, open as a museum.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'The Grant Seafood Festival — every spring, and the whole town works it.', s:'https://www.grantseafoodfestival.com/information', sn:'Grant Seafood Festival'}
  ],
  openers:[
   'Malabar: “Is it true the town made the sandhill crane the official bird? I keep having to stop for them.”',
   'Palm Bay: “Was this one of the old Port Malabar lots? I keep hearing about ten dollars down, ten dollars a month.”',
   'Grant: “Do you work the seafood festival, or do you leave town that weekend?”',
   'Barefoot Bay: “I came down from Vero — I did not know this was the biggest manufactured community in the state until this week.”'
  ]
 },

 north:{
  history:[
   {t:'Melbourne is named after Melbourne, Australia. Mrs. R. W. Goode suggested it to honour Cornthwaite John Hector, an Englishman who had lived in Australia and became the area’s first postmaster, then opened a general store at Crane Creek.', s:'https://downtownmelbourne.com/about/history/', sn:'Downtown Melbourne'},
   {t:'The railroad arrived in 1893, and Crane Creek gave farmers a port to ship out of. That is the reason a town is here at all.', s:'https://downtownmelbourne.com/about/history/', sn:'Downtown Melbourne'},
   {t:'A fire in 1919 destroyed every commercial building on Front Street. The town rebuilt one street over, on New Haven Avenue, during the 1920s boom — which is why downtown faces the way it does.', s:'https://downtownmelbourne.com/about/history/', sn:'Downtown Melbourne'},
   {t:'Fort Pierce was the biggest city on Florida’s Atlantic coast between Daytona and West Palm until 1970 — the year Melbourne passed it.', s:'https://en.wikipedia.org/wiki/Fort_Pierce,_Florida', sn:'Fort Pierce, Florida'},
   {t:'Northeast Palm Bay — Emerson, Holiday Park, Meadowbrook — is General Development Corporation ground, platted as Port Malabar from 1959 and sold by mail for ten dollars down.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'}
  ],
  legends:[
   {t:'LEGEND — the Henegar Center has a balcony ghost the theatre people call Jonathan, who moves things and makes noise during rehearsals.', s:'https://www.hauntedplaces.org/haunted-places-in-brevard-county-florida/', sn:'Haunted Places'},
   {t:'LEGEND — the 1900 Building on New Haven, built in 1924 as the Melbourne Hotel, is supposed to be haunted by a girl named Amelia who lived there.', s:'https://www.hauntedplaces.org/haunted-places-in-brevard-county-florida/', sn:'Haunted Places'},
   {t:'LEGEND — the 1894 railroad bridge at the creek downtown carries a set of ghost stories about women killed on the tracks, including three teenagers in the 1920s. Ghost-tour lore, not a record.', s:'https://www.hauntedplaces.org/haunted-places-in-brevard-county-florida/', sn:'Haunted Places'}
  ],
  heroes:[
   {t:'Cornthwaite John Hector — the English postmaster the town is named for, by way of Australia. A man who ran the mail and a store and ended up with a city named after his old address.', s:'https://downtownmelbourne.com/about/history/', sn:'Downtown Melbourne'},
   {t:'The Rossetter sisters — their house on the river is a museum now, kept as the family left it.', s:'https://www.hauntedplaces.org/haunted-places-in-brevard-county-florida/', sn:'Haunted Places'}
  ],
  landmarks:[
   {t:'The Henegar Center and the Rossetter House Museum, both downtown.', s:'https://www.hauntedplaces.org/haunted-places-in-brevard-county-florida/', sn:'Haunted Places'},
   {t:'New Haven Avenue — the street the 1919 fire built.', s:'https://downtownmelbourne.com/about/history/', sn:'Downtown Melbourne'},
   {t:'Crane Creek and the Melbourne Harbor marina, where the produce used to leave from.', s:'https://downtownmelbourne.com/about/history/', sn:'Downtown Melbourne'},
   {t:'Turkey Creek Sanctuary in Palm Bay — the boardwalk everybody walks.', s:'https://en.wikipedia.org/wiki/Turkey_Creek_Sanctuary', sn:'Turkey Creek Sanctuary'}
  ],
  openers:[
   'Melbourne: “Somebody told me the town is named after Melbourne, Australia because the first postmaster lived there. Is that the story you heard?”',
   'Melbourne: “I read the whole of Front Street burned in 1919 and they rebuilt on New Haven. Is that why downtown sits the way it does?”',
   'Palm Bay: “Are these the original Port Malabar houses? I am told the lots sold for ten dollars a month.”'
  ]
 },

 fp:{
  history:[
   {t:'The fort was built in 1838 in the Second Seminole War and named for Lt. Col. Benjamin Kendrick Pierce — the brother of President Franklin Pierce. It was only there until 1842.', s:'https://en.wikipedia.org/wiki/Fort_Pierce,_Florida', sn:'Fort Pierce, Florida'},
   {t:'The city incorporated in 1901 and calls itself the Sunrise City. Fishing, citrus, pineapples and cattle built it.', s:'https://en.wikipedia.org/wiki/Fort_Pierce,_Florida', sn:'Fort Pierce, Florida'},
   {t:'The Navy trained its first frogmen here in World War II. That is why the National Navy UDT-SEAL Museum sits on A1A north of town — Congress made it a national museum on 7 February 2008.', s:'https://en.wikipedia.org/wiki/National_Navy_UDT-SEAL_Museum', sn:'UDT-SEAL Museum'},
   {t:'Twenty-six Black landscape painters — the Florida Highwaymen — worked out of Fort Pierce from the mid-1950s. Galleries would not show them, so they sold from car trunks along US-1 and A1A. About 200,000 paintings. All 26 went into the Florida Artists Hall of Fame in 2004.', s:'https://en.wikipedia.org/wiki/Florida_Highwaymen', sn:'Florida Highwaymen'},
   {t:'Zora Neale Hurston lived in the Lincoln Park neighbourhood and is buried in Fort Pierce.', s:'https://en.wikipedia.org/wiki/Fort_Pierce,_Florida', sn:'Fort Pierce, Florida'}
  ],
  legends:[
   {t:'LEGEND — the Boston House on Indian River Drive is said to be haunted by a red-haired maid asking for help finding her son.', s:'https://usghostadventures.com/fort-pierce-ghost-tour/', sn:'Fort Pierce ghost tour'},
   {t:'LEGEND — the Sunrise Theatre, built in 1923, is supposed to have a phantom piano player, with more activity reported after the 2006 renovation.', s:'https://usghostadventures.com/fort-pierce-ghost-tour/', sn:'Fort Pierce ghost tour'},
   {t:'LEGEND — the P.P. Cobb building downtown, where a bullet meant for Cobb hit the man next to him. The ghost is said to call the names of the living.', s:'https://usghostadventures.com/fort-pierce-ghost-tour/', sn:'Fort Pierce ghost tour'}
  ],
  heroes:[
   {t:'Alfred Hair — the young painter who turned a way of painting fast into a living for 26 artists, and A.E. “Beanie” Backus, the white landscape painter who taught him from 1955 when that was not a normal thing to do.', s:'https://en.wikipedia.org/wiki/Florida_Highwaymen', sn:'Florida Highwaymen'},
   {t:'Mary Ann Carroll — the only woman among the Highwaymen, raising children and selling paintings out of a car.', s:'https://en.wikipedia.org/wiki/Florida_Highwaymen', sn:'Florida Highwaymen'},
   {t:'Zanobia Jefferson — the Lincoln Park Academy art teacher who taught the first of them. A school teacher started the whole thing.', s:'https://en.wikipedia.org/wiki/Florida_Highwaymen', sn:'Florida Highwaymen'},
   {t:'The frogmen — the men who trained in the surf here and became the Navy SEALs. Plenty of veterans in this county know exactly where that beach is.', s:'https://en.wikipedia.org/wiki/National_Navy_UDT-SEAL_Museum', sn:'UDT-SEAL Museum'}

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.js"></script>
<script>
/* ============================================================
   Sources. All open access — no key, no account, no bill.
   ============================================================ */
var FDOR    = 'https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest/services/Florida_Statewide_Cadastral/FeatureServer/0/query';
var NAIP    = 'https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPPlus/ImageServer/exportImage';
var STREETS = 'https://tiles.openfreemap.org/styles/liberty';   /* OpenStreetMap data, free, no key */
var ESRI    = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
var ESRILAB = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';

var S = { mode:'overview', area:'all', base:'map', route:null, doors:[], blocks:[], bi:0,
          map:null, geo:null, styled:false, me:null, tab:'doors', snap:'half',
          /* skip doors that already got a new roof — on by default, remembered */
          skipRR:(function(){ try{ return localStorage.getItem('sb:skiprr') !== '0'; }catch(e){ return true; } })() };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function qs(o){ var a=[]; for(var k in o){ a.push(encodeURIComponent(k)+'='+encodeURIComponent(o[k])); } return a.join('&'); }
function lossOf(r){
  var a = AREAS.filter(function(x){ return x.id===r.area; })[0];
  return r.loss || (a && a.loss);
}
/* Some routes are permit-led, not storm-led: no confirmed storm means no
   filing clock. Never invent one — say so instead. */
function fileText(r, long){
  var l = lossOf(r);
  if(!l) return long ? 'no storm date — permit-led' : 'no storm clock';
  return daysLeft(l) + (long ? ' days to file' : 'd to file');
}
function daysLeft(iso){
  var loss = new Date(iso+'T12:00:00'), end = new Date(loss.getTime());
  end.setFullYear(end.getFullYear()+1);
  return Math.round((end - new Date())/86400000);
}
function era(y){ if(!y || y<1900 || y>=2015) return 3; if(y>=2000) return 2; if(y>=1980) return 1; return 0; }
var ERA_COLOR = ['#c1524a','#d4a24c','#c4a574','#9aa3b8'];
var ERA_NAME  = ['Before 1980','1980–1999','2000–2014','2015 or newer'];

/* ---------- the county records ---------- */
function fetchParcels(r){
  var b = [r.center[1]-r.d, r.center[0]-r.d, r.center[1]+r.d, r.center[0]+r.d].join(',');
  var url = FDOR + '?' + qs({
    f:'json', where:"DOR_UC IN ('001','002')", geometry:b, geometryType:'esriGeometryEnvelope',
    inSR:'4326', spatialRel:'esriSpatialRelIntersects',
    outFields:'PARCEL_ID,PHY_ADDR1,PHY_CITY,PHY_ZIPCD,ACT_YR_BLT,EFF_YR_BLT,JV,TOT_LVG_AR,OWN_NAME,DOR_UC',
    returnCentroid:'true', returnGeometry:'false', outSR:'4326', resultRecordCount:'2000'
  });
  return fetch(url).then(function(x){ return x.json(); }).then(function(j){
    if(j.error) throw new Error(j.error.message||'record service error');
    return (j.features||[]).map(function(f){
      var a=f.attributes, c=f.centroid||{};
      return { id:a.PARCEL_ID, ad:(a.PHY_ADDR1||'').replace(/\s+/g,' ').trim(), city:(a.PHY_CITY||'').trim(),
               zip:(a.PHY_ZIPCD||''), yr:a.ACT_YR_BLT||a.EFF_YR_BLT||0, jv:a.JV||0,
               sf:a.TOT_LVG_AR||0, own:(a.OWN_NAME||'').trim(), lat:c.y, lon:c.x };
    }).filter(function(p){ return p.lat && p.ad; });
  });
}
function cacheGet(id){
  try{ var v = JSON.parse(localStorage.getItem('sb:p:'+id)||'null');
       if(v && (Date.now()-v.t) < 30*86400000) return v.rows; }catch(e){}
  return null;
}
function cacheSet(id, rows){ try{ localStorage.setItem('sb:p:'+id, JSON.stringify({t:Date.now(), rows:rows})); }catch(e){} }

/* Walk one side of the street, then come back down the other.
   US house numbers put odds on one kerb and evens on the other, so that split
   IS the two sides. Up the odd side low-to-high, cross once at the far end,
   back down the even side high-to-low — you finish where you parked and you
   never cross the road mid-block. */
function oneSideThenTheOther(on){
  var odd = [], even = [];
  on.forEach(function(p){
    var n = parseInt(p.ad, 10);
    if(!n) { odd.push(p); return; }
    (n % 2 ? odd : even).push(p);
  });
  var byNo = function(a,b){ return (parseInt(a.ad,10)||0) - (parseInt(b.ad,10)||0); };
  odd.sort(byNo); even.sort(byNo);
  if(!odd.length) return even;
  if(!even.length) return odd;
  return odd.concat(even.reverse());
}

/* ---------- the walk: streets in order, chained corner to corner ---------- */
function orderDoors(rows, r){
  var groups = [];
  r.streets.forEach(function(st){
    var on = rows.filter(function(p){
      var a = p.ad.toUpperCase(), i = a.indexOf(' ');
      return i > -1 && a.slice(i+1) === st;
    });
    if(!on.length) return;
    groups.push(oneSideThenTheOther(on));
  });
  if(!groups.length) return [];
  var far = function(a,b){ var dx=(a.lat-b.lat)*111, dy=(a.lon-b.lon)*98; return dx*dx+dy*dy; };
  var out = groups.shift(), left = groups;
  while(left.length){
    var end = out[out.length-1], bi = 0, bd = Infinity, flip = false;
    left.forEach(function(g, i){
      var d1 = far(end, g[0]), d2 = far(end, g[g.length-1]), d = Math.min(d1, d2);
      if(d < bd){ bd = d; bi = i; flip = d2 < d1; }
    });
    var g = left.splice(bi,1)[0];
    if(flip) g.reverse();
    out = out.concat(g);
  }
  return out;
}

/* ---------- blocks: one afternoon at this street's pace ---------- */
var HOURS = 4;
function blockTarget(r){ return Math.round((r.pace||13) * HOURS); }
function makeBlocks(d, target){
  if(d.length <= target*1.25) return [d];
  var n = Math.ceil(d.length/target), size = Math.round(d.length/n);
  function stOf(p){ return p.ad.slice(p.ad.indexOf(' ')+1); }
  var corners = [];
  for(var i=1; i<d.length; i++){ if(stOf(d[i]) !== stOf(d[i-1])) corners.push(i); }
  var cuts = [], prev = 0;
  for(var j=1; j<n; j++){
    var ideal = Math.round(j*size), best = ideal, bd = size*0.35;
    corners.forEach(function(c){
      var gap = Math.abs(c-ideal);
      if(gap < bd && c > prev + size*0.4 && c < d.length - size*0.4){ bd = gap; best = c; }
    });
    if(best > prev){ cuts.push(best); prev = best; }
  }
  var out = [], from = 0;
  cuts.forEach(function(c){ out.push(d.slice(from,c)); from = c; });
  out.push(d.slice(from));
  return out.filter(function(b){ return b.length; });
}
function blockName(b){
  var a = b[0].ad.slice(b[0].ad.indexOf(' ')+1);
  var z = b[b.length-1].ad.slice(b[b.length-1].ad.indexOf(' ')+1);
  return a === z ? a : a + ' to ' + z;
}
function vis(){
  /* blocks are already built from knockable(), so a single block still
     honours the "skip the ones with a new roof" switch */
  if(S.blocks && S.blocks.length) return S.blocks[Math.min(S.bi, S.blocks.length-1)];
  return knockable(S.doors);
}
function setBlock(i){
  S.bi = i;
  try{ localStorage.setItem('sb:b:'+S.route.id, i); }catch(e){}
  renderRoute(); paintMap();
  document.getElementById('sheetbody').scrollTop = 0;
}

/* ---------- marks ---------- */
function markOf(id, rid){ try{ return localStorage.getItem('sb:m:'+(rid||S.route.id)+':'+id)||''; }catch(e){ return ''; } }
function setMark(id, v){
  try{
    var k = 'sb:m:'+S.route.id+':'+id;
    if(markOf(id)===v) localStorage.removeItem(k); else localStorage.setItem(k, v);
  }catch(e){}
  renderRoute(); paintMap();
}

/* ---------- when it gets dark (USNO algorithm, no network) ---------- */
function sunsetAt(lat, lon, when){
  var rad = Math.PI/180, start = new Date(when.getFullYear(), 0, 0);
  var day = Math.floor((when - start)/86400000), lngHour = lon/15;
  var t = day + ((18 - lngHour)/24);
  var M = (0.9856*t) - 3.289;
  var L = M + (1.916*Math.sin(M*rad)) + (0.020*Math.sin(2*M*rad)) + 282.634; L = (L+360)%360;
  var RA = Math.atan(0.91764*Math.tan(L*rad))/rad; RA = (RA+360)%360;
  RA = (RA + (Math.floor(L/90)*90 - Math.floor(RA/90)*90))/15;
  var sinDec = 0.39782*Math.sin(L*rad), cosDec = Math.cos(Math.asin(sinDec));
  var cosH = (Math.cos(90.833*rad) - (sinDec*Math.sin(lat*rad))) / (cosDec*Math.cos(lat*rad));
  if(cosH > 1 || cosH < -1) return null;
  var H = (Math.acos(cosH)/rad)/15, T = H + RA - (0.06571*t) - 6.622;
  var UT = ((T - lngHour) % 24 + 24) % 24;
  var out = new Date(when.getTime());
  out.setUTCHours(Math.floor(UT), Math.round((UT % 1)*60), 0, 0);
  return out;
}
function clock(d){
  if(!d) return '—';
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'pm' : 'am';
  h = h % 12; if(!h) h = 12;
  return h + ':' + (m<10?'0':'') + m + ap;
}
function addMin(d, mins){ return new Date(d.getTime() + mins*60000); }
function miles(a, b){ var dx=(a[0]-b[0])*69, dy=(a[1]-b[1])*60.6; return Math.sqrt(dx*dx+dy*dy); }
function blockCentre(b){
  var la=0, lo=0, n=0;
  b.forEach(function(p){ if(p.lat){ la+=p.lat; lo+=p.lon; n++; } });
  return n ? [la/n, lo/n] : S.route.center;
}
function plan(b){
  var r = S.route, pace = r.pace || 13;
  var left = b.filter(function(p){ return !markOf(p.id); }).length;
  var now = new Date(), start = new Date(); start.setHours(15,30,0,0);
  if(now > start) start = new Date(Math.ceil(now.getTime()/300000)*300000);
  var dark = sunsetAt(r.center[0], r.center[1], new Date());
  var lastKnock = dark ? addMin(dark, -15) : null;
  var mins = Math.round(left/pace*60), end = addMin(start, mins);
  var road = miles(YARD, blockCentre(b)) * 1.3, drive = Math.round(road/45*60) + 8;
  return { pace:pace, left:left, start:start, dark:dark, lastKnock:lastKnock, mins:mins, end:end,
           road:road, drive:drive, fits: lastKnock ? end <= lastKnock : true,
           over: lastKnock ? Math.max(0, Math.round((end - lastKnock)/60000)) : 0 };
}

/* ---------- modes ---------- */
function goOverview(){
  S.mode = 'overview'; S.route = null; S.doors = []; S.blocks = []; S.bi = 0;
  document.getElementById('backbtn').style.display = 'none';
  document.getElementById('tb-title').innerHTML = '<b>The Street Book</b><small>Covenant Builders &middot; where the storm hit</small>';
  renderFilters(); renderOverview(); paintMap(); snap('hidden');
}
function focusRoute(id){
  S.route = ROUTES.filter(function(r){ return r.id===id; })[0];
  S.mode = 'route'; S.doors = []; S.blocks = []; S.bi = 0; S.tab = 'doors';
  var a = AREAS.filter(function(x){ return x.id===S.route.area; })[0];
  document.getElementById('backbtn').style.display = 'block';
  document.getElementById('tb-title').innerHTML =
    '<b>'+esc(S.route.name)+'</b><small>'+esc(S.route.town)+' &middot; '+fileText(S.route, true)+'</small>';
  if(S.map) S.map.jumpTo({ center:[S.route.center[1], S.route.center[0]], zoom:14.5 });
  snap('peek');
  var cached = cacheGet(S.route.id);
  if(cached){ S.doors = orderDoors(cached, S.route); afterLoad(); }
  else { document.getElementById('sheetbody').innerHTML = '<div class="loading">Pulling the county records for these streets…</div>'; renderRouteHead(); }
  load();
}
function load(){
  fetchParcels(S.route).then(function(rows){
    cacheSet(S.route.id, rows);
    S.doors = orderDoors(rows, S.route);
    afterLoad();
  }).catch(function(e){
    if(!S.doors.length){
      document.getElementById('sheetbody').innerHTML =
        '<div class="warn"><b>The record service did not answer.</b><br>'+esc(e.message)+
        '<br><br>You need a signal the first time you open a route. After that it is saved on this phone.</div>'+
        '<button class="btn prime" onclick="load()">Try again</button>';
    }
  });
}
function reload(){ try{ localStorage.removeItem('sb:p:'+S.route.id); }catch(e){} load(); }
function afterLoad(){
  tagRoofed(S.doors);
  S.blocks = makeBlocks(knockable(S.doors), blockTarget(S.route));
  var want = 0;
  try{ want = parseInt(localStorage.getItem('sb:b:'+S.route.id),10) || 0; }catch(e){}
  S.bi = Math.max(0, Math.min(want, S.blocks.length-1));
  renderRoute(); paintMap();
}

/* ---------- the sheet slides like a maps app ---------- */
function snap(state){
  var el = document.getElementById('sheet');
  el.className = state === 'full' ? 'full' : (state === 'half' ? 'half' : (state === 'peek' ? 'peek' : 'hidden'));
  S.snap = state;
  var pill = document.getElementById('opensheet');
  if(pill) pill.style.display = (state === 'hidden') ? 'flex' : 'none';
}
function openSheet(){ snap(S.snap === 'hidden' ? 'half' : 'full'); }
function initSheet(){
  var el = document.getElementById('sheet'), grab = document.getElementById('grab');
  var y0 = null, t0 = 0;
  grab.addEventListener('pointerdown', function(e){ y0 = e.clientY; t0 = Date.now(); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointerup', function(e){
    if(y0 === null) return;
    var dy = e.clientY - y0, quick = (Date.now()-t0) < 400;
    y0 = null;
    var up = ['hidden','peek','half','full'];
    var i = Math.max(0, up.indexOf(S.snap));
    if(dy < -30 || (quick && dy < -8)) snap(up[Math.min(3, i+1)]);
    else if(dy > 30) snap(up[Math.max(0, i-1)]);
    else snap(S.snap === 'full' ? 'half' : 'full');
  });
}

/* ---------- the walk list, as a file ---------- */
function csvOf(rows, label){
  var out = ['Name,Address,City,Owner of record,Year built,Block,Status'];
  rows.forEach(function(p){
    var m = markOf(p.id);
    var st = m==='k' ? 'Knocked' : m==='n' ? 'Not home' : m==='l' ? 'LEAD' : '';
    out.push([p.ad, p.ad+', '+(p.city||'')+' FL '+(p.zip||''), p.city||'', p.own||'', p.yr||'', label, st]
      .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
  });
  return out.join('\n');
}
function downloadCsv(all){
  var rows = all ? S.doors : vis();
  var label = all ? S.route.name : 'Block '+(S.bi+1);
  var name = S.route.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + (all?'-all':'-block'+(S.bi+1)) + '.csv';
  var blob = new Blob([csvOf(rows, label)], { type:'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function copyLeads(){
  var out = [S.route.name+' — '+S.route.town+' — '+new Date().toDateString(), ''];
  S.doors.forEach(function(p){
    var m = markOf(p.id);
    if(!m) return;
    out.push((m==='k'?'KNOCKED':(m==='l'?'LEAD':'NOT HOME'))+'\t'+p.ad+'\t'+(p.own||'')+'\tbuilt '+(p.yr||''));
  });
  if(out.length===2) out.push('Nothing marked yet.');
  var t = out.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(t); alert('Copied. Paste it into the CRM or an email.'); }
  else prompt('Copy this:', t);
}
</script>
<script>
/* ============================================================
   The map — MapLibre GL over OpenStreetMap vector tiles.
   Open data, open engine, no key and no bill.
   ============================================================ */
var MARKERS = [];
function rasterStyle(tiles, attrib, labels){
  var st = { version:8, glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources:{ img:{ type:'raster', tiles:[tiles], tileSize:256, maxzoom:20, attribution:attrib } },
    layers:[{ id:'sat', type:'raster', source:'img' }] };
  if(labels){
    st.sources.lab = { type:'raster', tiles:[labels], tileSize:256, maxzoom:20 };
    st.layers.push({ id:'labels', type:'raster', source:'lab' });
  }
  return st;
}
function styleFor(k){
  if(k === 'sat')  return rasterStyle(ESRI, 'Imagery: Esri, Maxar, Earthstar');
  if(k === 'hyb')  return rasterStyle(ESRI, 'Imagery: Esri, Maxar, Earthstar', ESRILAB);
  if(k === 'naip') return rasterStyle(NAIP + '?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=jpgpng&f=image',
                                      'Aerial: USDA NAIP via USGS — public domain');
  return STREETS;
}
function setBase(k){
  S.base = k;
  try{ localStorage.setItem('sb:base', k); }catch(e){}
  var bs = document.querySelectorAll('#layers button');
  for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute('data-b')===k ? 'on' : '';
  document.getElementById('layers').style.display = 'none';
  if(S.map){ S.styled = false; S.map.setStyle(styleFor(k)); }
}
function toggleLayers(){
  var el = document.getElementById('layers');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function buildMap(){
  var want = 'map';
  try{ want = localStorage.getItem('sb:base') || 'map'; }catch(e){}
  S.base = want;
  S.map = new maplibregl.Map({
    container:'map', style:styleFor(want), center:[-80.60, 27.95], zoom:8.4,
    attributionControl:{ compact:true }, maxPitch:60
  });
  S.map.addControl(new maplibregl.NavigationControl({ showZoom:true, showCompass:false }), 'bottom-left');
  S.map.addControl(new maplibregl.NavigationControl({ showZoom:false, visualizePitch:true }), 'bottom-right');
  S.map.dragPan.enable(); S.map.touchZoomRotate.enable(); S.map.scrollZoom.enable();
  S.geo = new maplibregl.GeolocateControl({
    positionOptions:{ enableHighAccuracy:true }, trackUserLocation:true, showUserHeading:true, showAccuracyCircle:true
  });
  S.map.addControl(S.geo);
  S.geo.on('geolocate', function(pos){
    S.me = [pos.coords.latitude, pos.coords.longitude];
    document.getElementById('gpsfab').className = 'fab on';
    if(S.mode === 'route') renderRouteHead(); else renderOverview();
  });
  S.map.on('style.load', function(){ S.styled = true; addOverlays(); paintMap(); paintRoofs(); loadRoofs(); });
  S.map.on('click', 'doors', function(e){ doorPopup(e.features[0]); });
  S.map.on('mouseenter', 'doors', function(){ S.map.getCanvas().style.cursor = 'pointer'; });
  S.map.on('mouseleave', 'doors', function(){ S.map.getCanvas().style.cursor = ''; });
  var bs = document.querySelectorAll('#layers button');
  for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute('data-b')===want ? 'on' : '';
}
function locateMe(){ if(S.geo) S.geo.trigger(); }

/* Sources and layers, rebuilt after every style change.
   Dots, not billboards: a circle layer for the marks and a symbol layer for the
   names, so MapLibre's own collision engine drops a label instead of stacking
   two on top of each other. */
var FONT = ['Noto Sans Regular'];
function addOverlays(){
  var m = S.map;
  if(!m.getSource('storm')){
    /* THE STORM ITSELF. One footprint per storm area: a circle that holds every
       ground report plus three miles of margin, filled in hail colour and labelled
       with the biggest hail that fell. Drawn first, so the neighbourhood dots and
       every door sit inside it, on top of it. */
    m.addSource('storm', { type:'geojson', data:fc() });
    m.addLayer({ id:'storm-fill', type:'fill', source:'storm', filter:['==',['geometry-type'],'Polygon'], paint:{
      'fill-color':['match',['get','kind'],'hail','#d4a24c','wind','#5b8def','#9aa3b8'], 'fill-opacity':.2 } });
    m.addLayer({ id:'storm-line', type:'line', source:'storm', filter:['==',['geometry-type'],'Polygon'], paint:{
      'line-color':['match',['get','kind'],'hail','#a5731f','wind','#2f5fc4','#5b667c'], 'line-width':2.5, 'line-dasharray':[3,2], 'line-opacity':1 } });
    m.addLayer({ id:'storm-lab', type:'symbol', source:'storm', filter:['==',['geometry-type'],'Point'],
      layout:{ 'text-field':['get','label'], 'text-font':FONT, 'text-size':['interpolate',['linear'],['zoom'], 7,11, 10,14, 13,16],
               'text-anchor':'bottom', 'text-offset':[0,-0.4], 'text-line-height':1.25, 'text-max-width':14,
               'text-allow-overlap':true, 'text-ignore-placement':true },
      paint:{ 'text-color':['match',['get','kind'],'hail','#6b4a0a','wind','#1f3f8a','#3a4358'],
              'text-halo-color':'#ffffff', 'text-halo-width':2.6 } });
  }
  if(!m.getSource('rings')){
    m.addSource('rings', { type:'geojson', data:fc() });
    m.addLayer({ id:'rings-fill', type:'fill', source:'rings', paint:{ 'fill-color':'#d4a24c', 'fill-opacity':.07 } });
    m.addLayer({ id:'rings-line', type:'line', source:'rings', paint:{ 'line-color':'#d4a24c', 'line-width':1, 'line-opacity':.5 } });
  }
  /* no walk line: he knocks one side of the street and comes back down the other,
     so a string joining house to house across the road was noise, not a route */
  if(!m.getSource('rrdoors')){
    /* doors that already got a new roof — drawn under the live doors, dim */
    m.addSource('rrdoors', { type:'geojson', data:fc() });
    m.addLayer({ id:'rrdoors', type:'circle', source:'rrdoors', paint:{
      'circle-radius':['interpolate',['linear'],['zoom'], 13,2.5, 16,4.5, 19,7],
      'circle-color':'#9aa3b8', 'circle-opacity':.45,
      'circle-stroke-color':'#ffffff', 'circle-stroke-width':1 } });
    m.on('click', 'rrdoors', function(e){
      var p = e.features[0].properties;
      new maplibregl.Popup({ offset:12 }).setLngLat(e.features[0].geometry.coordinates)
        .setHTML('<b>'+esc(p.ad)+'</b><br><span style="color:#5b667c">Skipped</span>'+
          '<br>New roof permitted <b>'+esc(p.when)+'</b>'+
          '<br><span style="color:#5b667c;font-size:11px">Off the walk list because a roof this new will not sell. '+
          'The county record only goes back to 2021.</span>').addTo(m);
    });
    m.on('mouseenter', 'rrdoors', function(){ m.getCanvas().style.cursor='pointer'; });
    m.on('mouseleave', 'rrdoors', function(){ m.getCanvas().style.cursor=''; });
  }
  if(!m.getSource('doors')){
    m.addSource('doors', { type:'geojson', data:fc() });
    m.addLayer({ id:'doors', type:'circle', source:'doors', paint:{
      /* a marked door wears its mark, not the age of the house. Green = knocked,
         amber = a lead and the biggest thing on the screen, slate = nobody home
         and faded back. Unmarked doors keep the era colour. */
      'circle-radius':['interpolate',['linear'],['zoom'],
        13, ['match',['get','mark'],'l',5,3],
        16, ['match',['get','mark'],'l',9.5,6],
        19, ['match',['get','mark'],'l',15,11]],
      'circle-color':['match',['get','mark'],'k','#0B6E2D','l','#FFB300','n','#5B667C',['get','color']],
      'circle-stroke-width':['match',['get','mark'],'l',3.5,'k',2.5,'n',1.2,1.4],
      'circle-stroke-color':['match',['get','mark'],'l','#12182B','#ffffff'],
      'circle-opacity':['case',['==',['get','mark'],'n'],.4,1] } });
    m.addLayer({ id:'doorno', type:'symbol', source:'doors', minzoom:17.5,
      layout:{ 'text-field':['get','n'], 'text-font':FONT, 'text-size':10, 'text-offset':[0,-1.2] },
      paint:{ 'text-color':'#12182B', 'text-halo-color':'#fff', 'text-halo-width':1.4 } });
  }
  if(!m.getSource('storms')){
    m.addSource('storms', { type:'geojson', data:fc() });
    m.addLayer({ id:'storms-dot', type:'circle', source:'storms', paint:{
      'circle-radius':['interpolate',['linear'],['zoom'], 7,4, 11,7, 15,10],
      'circle-color':'#d4a24c', 'circle-stroke-color':'#12182B', 'circle-stroke-width':1.5, 'circle-opacity':.95 } });
    m.addLayer({ id:'storms-lab', type:'symbol', source:'storms', minzoom:9.5,
      layout:{ 'text-field':['get','mag'], 'text-font':FONT, 'text-size':11, 'text-offset':[0,1.1],
               'text-anchor':'top', 'text-optional':true },
      paint:{ 'text-color':'#7a5a15', 'text-halo-color':'#fff', 'text-halo-width':1.6 } });
  }
  if(!m.getSource('roofs')){
    /* roofs added BEFORE routes so route dots and door dots stay on top */
    m.addSource('roofs', { type:'geojson', data:fc() });
    m.addLayer({ id:'roofs-dot', type:'circle', source:'roofs', paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],
        8,  ['match',['get','bucket'],'open',3.4,2.2],
        12, ['match',['get','bucket'],'open',5.4,3.6],
        16, ['match',['get','bucket'],'open',9,6.5]],
      'circle-color':['match',['get','bucket'],'open','#e07b00','new','#b3261e','mid','#e08a2e','#b9a99a'],
      'circle-opacity':['match',['get','bucket'],'open',1,'new',.95,'mid',.75,.45],
      'circle-stroke-color':['case',['==',['get','bucket'],'open'],'#12182B','#ffffff'],
      'circle-stroke-width':['match',['get','bucket'],'open',2,'new',1.4,'mid',1,.6] } });
    m.on('click', 'roofs-dot', function(e){ roofPopup(e.features[0]); });
    m.on('mouseenter', 'roofs-dot', function(){ m.getCanvas().style.cursor='pointer'; });
    m.on('mouseleave', 'roofs-dot', function(){ m.getCanvas().style.cursor=''; });
  }
  if(!m.getSource('routes')){
    m.addSource('routes', { type:'geojson', data:fc() });
    /* a zoom expression has to sit at the top of the property — nesting one
       inside a case makes MapLibre reject the whole layer, silently */
    m.addLayer({ id:'routes-dot', type:'circle', source:'routes', paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],
        7,  ['match',['get','kind'],'yard',4,5],
        11, ['match',['get','kind'],'yard',5,8],
        15, ['match',['get','kind'],'yard',6,10]],
      'circle-color':['match',['get','kind'],'yard','#ffffff','fp','#6b4f2a','near','#3f7d52','hail','#12182B','#3d4a6b'],
      'circle-stroke-color':['case',['==',['get','kind'],'yard'],'#12182B','#ffffff'],
      'circle-stroke-width':2.5 } });
    m.addLayer({ id:'routes-lab', type:'symbol', source:'routes', minzoom:8,
      layout:{ 'text-field':['get','label'], 'text-font':FONT, 'text-size':11.5, 'text-offset':[0,1.1],
               'text-anchor':'top', 'text-optional':true, 'text-max-width':9, 'text-padding':4 },
      paint:{ 'text-color':'#12182B', 'text-halo-color':'#ffffff', 'text-halo-width':2 } });
    ['routes-dot','routes-lab'].forEach(function(id){
      m.on('click', id, function(e){ var f=e.features[0]; if(f.properties.kind!=='yard') focusRoute(f.properties.id); });
      m.on('mouseenter', id, function(){ m.getCanvas().style.cursor='pointer'; });
      m.on('mouseleave', id, function(){ m.getCanvas().style.cursor=''; });
    });
    m.on('click', 'storms-dot', function(e){
      var p = e.features[0].properties;
      new maplibregl.Popup({ offset:12 }).setLngLat(e.features[0].geometry.coordinates)
        .setHTML('<b>'+esc(p.mag)+' '+esc(p.kind)+'</b><br>'+esc(p.t)+'<br>'+esc(p.txt)).addTo(m);
    });
  }
  /* the storm's name and hail size go on top of the stack, above route names */
  if(m.getLayer('storm-lab')) m.moveLayer('storm-lab');
}
function clearMarkers(){ MARKERS.forEach(function(m){ m.remove(); }); MARKERS = []; }
function setData(id, data){ var s = S.map.getSource(id); if(s) s.setData(data); }
function fc(f){ return { type:'FeatureCollection', features:f||[] }; }
function pt(lat, lon, props){ return { type:'Feature', geometry:{ type:'Point', coordinates:[lon,lat] }, properties:props }; }
/* One storm, one shape. Centre on the ground reports, reach out far enough to
   hold all of them plus three miles, and say the biggest hail that fell there.
   Hail wins over wind for the colour; radar-only areas have no reports and get
   no footprint, because nobody on the ground saw anything. */
function stormFootprint(a){
  var reps = a.reports || [];
  if(!reps.length) return null;
  var hail = reps.filter(function(r){ return r.kind === 'hail'; });
  var use = hail.length ? hail : reps;
  var la = 0, lo = 0;
  use.forEach(function(r){ la += r.lat; lo += r.lon; });
  la /= use.length; lo /= use.length;
  var far = 0;
  reps.forEach(function(r){ far = Math.max(far, miles([la, lo], [r.lat, r.lon])); });
  var rad = Math.max(4, far + 3);
  var big = 0, bigTxt = '';
  hail.forEach(function(r){ var m = parseFloat(r.mag); if(m > big){ big = m; bigTxt = r.mag; } });
  var gust = 0, gustTxt = '';
  reps.forEach(function(r){ if(r.kind !== 'hail'){ var m = parseFloat(r.mag); if(m > gust){ gust = m; gustTxt = r.mag; } } });
  var kind = hail.length ? 'hail' : 'wind';
  var line2 = hail.length ? bigTxt + ' hail' : gustTxt + ' gusts';
  if(hail.length && gustTxt) line2 += ' \u00b7 ' + gustTxt;
  var poly = ring(la, lo, rad); poly.properties = { kind:kind, id:a.id };
  var lab = pt(la + rad/69, lo, { kind:kind, id:a.id, label:a.name + '\n' + line2 + '\n' + (a.when||'') });
  return { poly:poly, label:lab, lat:la, lon:lo, rad:rad };
}
function ring(lat, lon, miles){
  var pts = [], R = miles/69;
  for(var i=0;i<=48;i++){
    var a = i/48*2*Math.PI;
    pts.push([lon + R*Math.cos(a)/Math.cos(lat*Math.PI/180), lat + R*Math.sin(a)]);
  }
  return { type:'Feature', geometry:{ type:'Polygon', coordinates:[pts] }, properties:{} };
}
function fit(pts){
  if(!pts.length) return;
  var w=180, s=90, e=-180, n=-90;
  pts.forEach(function(p){ w=Math.min(w,p[1]); e=Math.max(e,p[1]); s=Math.min(s,p[0]); n=Math.max(n,p[0]); });
  /* duration 0 on purpose: an animated camera move stalls whenever the tab is
     not in front, and a map that did not move is worse than one that jumped */
  var bottom = (S.snap === 'half' || S.snap === 'full') ? Math.round(window.innerHeight*0.46) : 130;
  try{ S.map.fitBounds([[w,s],[e,n]], { padding:{ top:110, bottom:bottom, left:40, right:40 }, duration:0, maxZoom:17.5 }); }catch(err){}
}

/* ---------- overview: every route on one map ---------- */
function paintOverview(){
  if(!S.styled) return;
  clearMarkers();
  setData('doors', fc()); setData('rrdoors', fc());
  var pts = [], storms = [], routes = [], foot = [];
  AREAS.forEach(function(a){
    if(S.area !== 'all' && S.area !== a.id) return;
    (a.reports||[]).forEach(function(rep){
      pts.push([rep.lat, rep.lon]);
      storms.push(pt(rep.lat, rep.lon, { mag:rep.mag, kind:(rep.kind==='hail'?'hail':'wind'), t:rep.t, txt:rep.txt }));
    });
    var f = stormFootprint(a);
    if(f){ foot.push(f.poly); foot.push(f.label); }
  });
  setData('rings', fc());
  setData('storm', fc(foot));
  setData('storms', fc(storms));
  ROUTES.forEach(function(r){
    if(S.area !== 'all' && S.area !== r.area) return;
    pts.push(r.center);
    var cached = cacheGet(r.id), d = cached ? orderDoors(cached, r) : [];
    var done = 0; d.forEach(function(p){ if(markOf(p.id, r.id)) done++; });
    routes.push(pt(r.center[0], r.center[1], { id:r.id, kind:r.area,
      label:r.name + (d.length ? '  ' + d.length : '') + (done ? ' \u00b7 ' + done + ' done' : '') }));
  });
  routes.push(pt(YARD[0], YARD[1], { id:'yard', kind:'yard', label:'The yard' }));
  pts.push(YARD);
  setData('routes', fc(routes));
  fit(pts);
}

/* ---------- one route ---------- */
function paintRoute(){
  if(!S.styled) return;
  clearMarkers();
  setData('rings', fc());
  var shown = vis(), pts = [], feats = [];
  var a = AREAS.filter(function(x){ return x.id===S.route.area; })[0];
  var f = a ? stormFootprint(a) : null;
  setData('storm', fc(f ? [f.poly] : []));
  setData('routes', fc());
  setData('storms', fc((a.reports||[]).map(function(rep){
    return pt(rep.lat, rep.lon, { mag:rep.mag, kind:(rep.kind==='hail'?'hail':'wind'), t:rep.t, txt:rep.txt });
  })));
  shown.forEach(function(p, i){
    if(!p.lat) return;
    pts.push([p.lat, p.lon]);
    feats.push({ type:'Feature', geometry:{ type:'Point', coordinates:[p.lon, p.lat] },
      properties:{ id:p.id, n:String(i+1), ad:p.ad, own:p.own||'', yr:p.yr||0, sf:p.sf||0,
                   color:ERA_COLOR[era(p.yr)], mark:markOf(p.id) } });
  });
  setData('doors', fc(feats));
  /* the ones we took off the list, so you can still see them */
  setData('rrdoors', fc((S.doors||[]).filter(function(p){ return p.rr && p.lat && shown.indexOf(p) < 0; })
    .map(function(p){ return pt(p.lat, p.lon, { ad:p.ad, when:ymLabel(p.rr) }); })));
  fit(pts);
}
function doorPopup(f){
  var p = f.properties;
  new maplibregl.Popup({ offset:12 })
    .setLngLat(f.geometry.coordinates)
    .setHTML('<b>'+esc(p.ad)+'</b><br><span style="color:#5b667c">Door '+p.n+' of '+vis().length+
      (S.blocks.length>1 ? ' &middot; block '+(S.bi+1) : '')+'</span><br>'+
      'Built '+(p.yr||'—')+(p.sf?' &middot; '+p.sf+' sq ft':'')+'<br>Owner of record: '+esc(p.own||'—')+
      '<br><button class="btn" onclick="setMark(\''+p.id+'\',\'k\')">Knocked</button>'+
      '<button class="btn" onclick="setMark(\''+p.id+'\',\'n\')">Not home</button>'+
      '<button class="btn" onclick="setMark(\''+p.id+'\',\'l\')">Lead</button>')
    .addTo(S.map);
}
function paintMap(){ if(!S.map || !S.styled) return; if(S.mode==='route') paintRoute(); else paintOverview(); }

function nearestDoor(){
  if(!S.me || !S.doors.length) return null;
  var best=null, bd=1e9;
  vis().forEach(function(p,i){
    if(!p.lat) return;
    var dx=(p.lat-S.me[0])*364000, dy=(p.lon-S.me[1])*322000, d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){ bd=d; best={i:i, p:p, ft:Math.round(d)}; }
  });
  return best;
}
function openDrive(){
  var pts = vis().filter(function(p){ return p.lat; });
  if(!pts.length){ alert('No doors loaded yet.'); return; }
  var picks = [], step = Math.max(1, Math.floor(pts.length/8));
  for(var i=0; i<pts.length && picks.length<8; i+=step) picks.push(pts[i]);
  var dest = pts[pts.length-1];
  window.open('https://www.google.com/maps/dir/?' + qs({
    api:'1', destination: dest.lat+','+dest.lon, travelmode:'driving',
    waypoints: picks.map(function(p){ return p.lat+','+p.lon; }).join('|')
  }), '_blank', 'noopener');
}
</script>
<script>
/* ============================================================
   ROOFS  —  Brevard County roof permits, 2021 to today
   ------------------------------------------------------------
   Where this comes from: Brevard County's Accela portal has a
   public report called "Permits Issued Details". Feed it a date
   range and it hands back a spreadsheet of every permit the
   COUNTY issued, with the contractor's name, licence and phone on
   every line. We pulled 2021 through today and kept the reroofs —
   24,269 of them. Each one was placed by its tax-account number
   against the county's own parcel layer.

   Two different jobs come out of one file:

   1. ROOFS GOING UP  (`recent`, since the 15 March hail)
      Red dots. A neighbour can SEE these. Proof the street got hit.

   2. ALREADY RE-ROOFED  (`old` + `recent`, 2021 onward)
      A house that got a new roof in the last five years is not
      buying another one. Those doors get greyed out and dropped
      from the walk, so you spend the afternoon on doors that can
      actually say yes.

   What it is NOT: the county only permits the unincorporated
   areas plus Grant-Valkaria. Palm Bay, Melbourne, Indialantic,
   Satellite Beach, Cocoa Beach and the rest issue their own and
   do not publish them. A blank patch over a city is a hole in the
   data, not a quiet neighbourhood. And the file starts at
   1 January 2021 with a gap from 1 Jan to 14 Mar 2026 — a roof
   older or inside that gap looks, to us, like no roof at all.
   ============================================================ */
var ROOFS = { loaded:false, on:true, rows:[], cs:[], st:[], ct:[], doc:null, idx:null, oldest:'2021' };

function loadRoofs(){
  if(ROOFS.loaded) return;
  fetch('roofs.json').then(function(r){ return r.json(); }).then(function(j){
    ROOFS.doc = j;
    ROOFS.cs  = j.contractors || [];
    ROOFS.st  = j.streets || [];
    ROOFS.ct  = j.cities || [];
    ROOFS.rows = j.recent || [];
    buildRoofIndex(j);
    ROOFS.loaded = true;
    paintRoofs();
    renderFilters();
    if(S.mode === 'route'){ if(S.doors.length) afterLoad(); }
    else renderOverview();
  }).catch(function(){ /* offline first run: the layer just stays empty */ });
}

/* ---------- the address index, for "has this door already been done?" ---------- */
function addrKey(num, street, city){
  return num + '|' + street + '|' + city;
}
/* strip the house number off a tax-roll address and normalise the rest */
function splitAddr(ad){
  var s = String(ad||'').replace(/\s+/g,' ').trim().toUpperCase();
  var m = s.match(/^(\d+)\s+(.*)$/);
  if(!m) return null;
  return { num:parseInt(m[1],10), street:m[2].trim() };
}
function buildRoofIndex(j){
  var ix = {}, byNumSt = {};
  function put(num, sI, cI, ymAbs){
    var st = ROOFS.st[sI] || '', ct = (ROOFS.ct[cI] || '').toUpperCase();
    var k = addrKey(num, st, ct);
    if(!(k in ix) || ymAbs > ix[k]) ix[k] = ymAbs;
    var k2 = num + '|' + st;
    if(!(k2 in byNumSt)) byNumSt[k2] = [];
    if(byNumSt[k2].indexOf(ct) < 0) byNumSt[k2].push(ct);
    var k3 = k2 + '#';
    if(!(k3 in ix) || ymAbs > ix[k3]) ix[k3] = ymAbs;
  }
  /* ymAbs = months since Jan 2021, so both halves of the file compare directly */
  (j.old||[]).forEach(function(o){ put(o[1], o[2], o[3], o[0]); });
  var baseMonths = (2026-2021)*12 + (3-1);          /* March 2026 */
  (j.recent||[]).forEach(function(r){
    var d = new Date(Date.UTC(2026,2,15) + r[2]*86400000);
    put(r[5], r[6], r[7], (d.getUTCFullYear()-2021)*12 + d.getUTCMonth());
  });
  ROOFS.idx = ix; ROOFS.amb = byNumSt;
}
/* months-since-Jan-2021 → "March 2024" */
var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function ymLabel(ym){ return MON[ym % 12] + ' ' + (2021 + Math.floor(ym/12)); }
function ymYear(ym){ return 2021 + Math.floor(ym/12); }
function ymAgoYears(ym){
  var now = (new Date()).getUTCFullYear()*12 + (new Date()).getUTCMonth() - (2021*12);
  return Math.max(0, (now - ym) / 12);
}
/* the newest reroof on this exact address, or 0 */
function roofedAt(p){
  if(!ROOFS.idx) return 0;
  var a = splitAddr(p.ad);
  if(!a) return 0;
  var city = String(p.city||'').trim().toUpperCase();
  var hit = ROOFS.idx[addrKey(a.num, a.street, city)];
  if(hit !== undefined) return hit;
  /* the tax roll and the permit book do not always agree on the town name.
     Fall back only when this number-and-street exists in exactly one town. */
  var towns = ROOFS.amb[a.num + '|' + a.street];
  if(towns && towns.length === 1){
    var h2 = ROOFS.idx[a.num + '|' + a.street + '#'];
    if(h2 !== undefined) return h2;
  }
  return 0;
}
/* stamp every door with p.rr = months-since-Jan-2021 of its last reroof */
function tagRoofed(doors){
  if(!ROOFS.loaded) return 0;
  var n = 0;
  doors.forEach(function(p){ var ym = roofedAt(p); p.rr = ym || 0; if(ym) n++; });
  return n;
}
function roofedCount(doors){
  var n = 0; (doors||[]).forEach(function(p){ if(p.rr) n++; }); return n;
}
/* the doors worth knocking: drop the ones that already have a new roof */
function knockable(doors){
  if(!S.skipRR) return doors;
  return doors.filter(function(p){ return !p.rr; });
}
function toggleSkipRR(){
  S.skipRR = !S.skipRR;
  try{ localStorage.setItem('sb:skiprr', S.skipRR ? '1' : '0'); }catch(e){}
  if(S.mode === 'route' && S.doors.length) afterLoad(); else { renderOverview(); paintMap(); }
}

/* ---------- the red dots: roofs going up now ---------- */
function roofAge(day){
  var base = Date.UTC(2026,2,15) + day*86400000;
  return Math.max(0, Math.round((Date.now() - base)/86400000));
}
function roofRow(r){
  var c = ROOFS.cs[r[3]] || ['','',''];
  return { lat:r[0], lon:r[1], age:roofAge(r[2]), val:r[4],
           ad:(r[5] ? r[5]+' ' : '') + (ROOFS.st[r[6]]||''),
           city:ROOFS.ct[r[7]]||'', zip:r[8],
           who:c[0], lic:c[1], tel:c[2], pend:(r.length>9 ? r[9] : -1) };
}
function roofsNear(lat, lon, mi, days){
  if(!ROOFS.loaded) return 0;
  var n = 0, R = mi/69, R2 = R*R, cs = Math.cos(lat*Math.PI/180);
  for(var i=0;i<ROOFS.rows.length;i++){
    var r = ROOFS.rows[i];
    if(days && roofAge(r[2]) > days) continue;
    var dy = r[0]-lat, dx = (r[1]-lon)*cs;
    if(dx*dx + dy*dy <= R2) n++;
  }
  return n;
}
function pendingCount(){
  if(!ROOFS.loaded) return 0;
  var n=0; ROOFS.rows.forEach(function(r){ if(r.length>9 && r[9]===1) n++; });
  return n;
}
function toggleRoofs(){ ROOFS.on = !ROOFS.on; paintRoofs(); renderFilters(); }

function paintRoofs(){
  if(!S.map || !S.styled) return;
  var src = S.map.getSource('roofs');
  if(!src) return;

    var bucket = p === 1 ? 'open' : (age<=30?'new':(age<=90?'mid':'old'));

/* ============================================================
   THE PROOF CARD
   ------------------------------------------------------------
   The strongest thing you can do on a porch is point. Not talk —
   point. "Three houses on this street pulled a roof permit in the
   last month." That is a fact off the county's books, it is
   checkable, and it is not a claim about anybody's damage.
   ============================================================ */
var PROOF_MI = 0.6;      /* a short walk: about ten minutes, and you can see it */
var PROOF_DAYS = 120;    /* after four months a new roof stops looking new */

function proofFor(doors){
  if(!ROOFS.loaded) return [];
  var pts = (doors||[]).filter(function(p){ return p.lat; })
                       .map(function(p){ return [p.lat, p.lon]; });
  if(!pts.length && S.route) pts = [S.route.center];
  if(!pts.length) return [];
  var R = PROOF_MI/69, R2 = R*R, out = [];
  for(var i=0;i<ROOFS.rows.length;i++){
    var row = ROOFS.rows[i], age = roofAge(row[2]);
    if(age > PROOF_DAYS) continue;
    var best = 1e9, cs = Math.cos(row[0]*Math.PI/180);
    for(var j=0;j<pts.length;j++){
      var dy = row[0]-pts[j][0], dx = (row[1]-pts[j][1])*cs, d2 = dx*dx+dy*dy;
      if(d2 < best) best = d2;
      if(best <= R2 && j > 40) break;
    }
    if(best <= R2){ var o = roofRow(row); o.ft = Math.round(Math.sqrt(best)*364000); out.push(o); }
  }
  out.sort(function(a,b){ return a.age - b.age; });
  return out;
}
function proofByStreet(list){
  var g = {}, order = [];
  list.forEach(function(p){
    var st = p.ad.replace(/^\s*\d+\s*/, '').trim().toUpperCase();
    if(!g[st]){ g[st] = []; order.push(st); }
    g[st].push(p);
  });
  return order.map(function(st){
    var rows = g[st].slice().sort(function(a,b){ return a.ft - b.ft; });
    return { street:st, rows:rows, ft:rows[0].ft };
  }).sort(function(a,b){ return a.ft - b.ft; });
}

/* the street you are actually standing on, for the opening line */
function ownStreet(doors){
  var c = {}, best = '', n = 0;
  (doors||[]).forEach(function(p){
    var st = String(p.ad||'').replace(/^\s*\d+\s*/, '').trim().toUpperCase();
    if(!st) return;
    c[st] = (c[st]||0)+1;
    if(c[st] > n){ n = c[st]; best = st; }
  });
  return best;
}
function titleCase(s){ return String(s).toLowerCase().replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); }); }
function ago(d){ return d === 0 ? 'today' : (d === 1 ? 'yesterday' : d + ' days ago'); }
