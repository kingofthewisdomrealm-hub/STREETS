<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12182B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Street Book — Covenant Builders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.css">
<style>
:root{
  --navy:#12182B; --sand:#c4a574; --word:#e9e7e2; --gold:#d4a24c;
  --ink:#1d2433; --ink2:#5b667c; --line:#e3e6ec; --card:#ffffff; --wash:#f5f6f8;
  --red:#c1524a; --green:#3f7d52; --blue:#1a73e8;
  --sheet-peek:132px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--wash);color:var(--ink);
  font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.disp,h1,h2,h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;margin:0}
button{font-family:inherit}

/* ---------- the map is the app ---------- */
#map{position:fixed;inset:0;z-index:0;background:#e8ebef}
.maplibregl-ctrl-attrib{font-size:9px}
.maplibregl-ctrl-bottom-right{margin-bottom:2px}
.maplibregl-ctrl-geolocate{display:none !important}
.maplibregl-popup-content{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;
  box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:260px}
.maplibregl-popup-content b{font-size:15px}
.maplibregl-user-location-dot, .maplibregl-user-location-accuracy-circle{z-index:5}

/* ---------- floating top bar ---------- */
#topbar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:1000;
  display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--word);
  border-radius:12px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
#topbar .crown{flex:none}
#tb-title{flex:1;min-width:0}
#tb-title b{display:block;font-size:14.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb-title small{display:block;font-size:11px;color:#a9b2c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backbtn{display:none;background:none;border:0;color:var(--word);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
.filters{position:fixed;top:calc(60px + env(safe-area-inset-top));left:0;right:0;z-index:999;
  display:flex;gap:6px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-size:12.5px;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14);cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--navy);color:var(--word);border-color:var(--navy)}

/* ---------- floating round buttons ---------- */
.fabs{position:fixed;right:10px;z-index:999;display:flex;flex-direction:column;gap:10px;
  bottom:calc(var(--sheet-peek) + 16px)}
.fab{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;color:var(--ink);padding:0}
.fab.on{background:var(--navy);color:var(--word);border-color:var(--navy)}

/* ---------- layer picker ---------- */
#layers{position:fixed;right:10px;bottom:calc(var(--sheet-peek) + 70px);z-index:1001;display:none;
  background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.28);padding:8px;width:190px}
#layers b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:2px 4px 6px}
#layers button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 8px;border-radius:8px;
  font-size:14px;color:var(--ink);cursor:pointer}
#layers button.on{background:var(--wash);font-weight:600}

/* ---------- the bottom sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1002;background:var(--card);
  border-radius:16px 16px 0 0;box-shadow:0 -3px 20px rgba(0,0,0,.20);
  height:88vh;transform:translateY(calc(88vh - var(--sheet-peek)));
  transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;touch-action:none}
#sheet.half{transform:translateY(45vh)}
#sheet.full{transform:translateY(0)}
#grab{padding:8px 0 4px;cursor:grab;flex:none}
#grab i{display:block;width:38px;height:4px;border-radius:2px;background:#c9cfdb;margin:0 auto}
#sheethead{padding:0 16px 8px;flex:none}
#sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + env(safe-area-inset-bottom));flex:1}

/* ---------- content bits ---------- */
h2.big{font-size:20px;margin:2px 0 2px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 8px}
p{font-size:14px;line-height:1.5;margin:8px 0}
ul{margin:6px 0;padding-left:20px}li{font-size:14px;line-height:1.45;margin:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--wash);border:1px solid var(--line);color:var(--ink)}
.chip.hot{background:var(--navy);color:var(--word);border-color:var(--navy)}
.chip.warn{background:#fdeceb;border-color:#f3c9c6;color:#8d3b35}
.btn{background:var(--wash);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:9px 12px;font-size:13.5px;cursor:pointer;margin:0 6px 6px 0}
.btn.prime{background:var(--navy);color:var(--word);border-color:var(--navy);font-weight:600}
.btn.sand{background:var(--sand);color:var(--navy);border-color:var(--sand);font-weight:600}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}
.rowbtn:last-child{border-bottom:0}
.rowdot{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff}
.rowtxt{flex:1;min-width:0}
.rowtxt b{display:block;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowtxt small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowgo{color:var(--ink2);font-size:20px;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:2px 0 4px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);
  padding:10px 2px;font-size:13.5px;cursor:pointer}
.tab.on{color:var(--navy);border-bottom-color:var(--sand);font-weight:600}
.pane{display:none}.pane.on{display:block}
.plan{background:#fff8ec;border:1px solid #f0dfc0;border-radius:10px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.55}
.warn{background:#fdeceb;border:1px solid #f3c9c6;border-radius:10px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.5}
.note{font-size:12px;color:var(--ink2);margin:8px 0;line-height:1.45}
.src{font-size:11px;color:var(--ink2)}
.src a{color:var(--ink2)}
h3.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:16px 0 4px}
.door{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}
.door .n{width:24px;color:var(--ink2);font-size:11.5px;flex:none;text-align:right}
.door .ad{flex:1;min-width:0}
.door .ad b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door .ad small{color:var(--ink2);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yr{font-size:11.5px;padding:2px 6px;border-radius:4px;flex:none}
.y0{background:#fbe3e1;color:#8d3b35}.y1{background:#fbeed4;color:#7a5a15}
.y2{background:#f1e8d9;color:#6b5733}.y3{background:#e9ecf1;color:#5b667c}
.mk{display:flex;gap:4px;flex:none}
.mk button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13px;cursor:pointer}
.mk button.on{background:var(--navy);color:var(--word);border-color:var(--navy);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink2);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.loading{padding:24px 0;text-align:center;color:var(--ink2);font-size:13.5px}

/* ---------- map marks ---------- */
.pin{background:var(--navy);color:var(--word);border:2px solid #fff;border-radius:999px;
  padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.fp{background:#6b4f2a}
.pin small{display:block;font-weight:400;font-size:10px;color:#c9cfdb}
.stormpin{background:var(--gold);color:#2a2107;border:2px solid #fff;border-radius:999px;padding:4px 9px;
  font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.yardpin{background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:4px 9px;
  font-size:11px;font-weight:700;white-space:nowrap}

/* ---------- print ---------- */
#print{display:none}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #map,#topbar,.filters,.fabs,#layers,#sheet{display:none !important}
  #print{display:block !important}
  #print .pg{break-after:page;page-break-after:always}
  #print .pg:last-child{break-after:auto;page-break-after:auto}
  #print h2{margin:0 0 4px;font-size:15px}
  #print .pl{font-size:10.5px;margin:2px 0 6px;color:#333}
  table.sheet{width:100%;border-collapse:collapse;font-size:10.5px}
  table.sheet th,table.sheet td{border:1px solid #444;padding:3px 4px;text-align:left}
  table.sheet td:nth-child(5),table.sheet td:nth-child(6){width:34px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <button id="backbtn" onclick="goOverview()" aria-label="Back">&#8592;</button>
  <svg class="crown" width="16" height="14" viewBox="0 0 147 121" aria-hidden="true">
    <path d="M11,116 L2,55 L45,66 L73,3 L101,66 L145,55 L136,116 Z" fill="none" stroke="#c4a574" stroke-width="14" stroke-linejoin="miter"/>
  </svg>
  <div id="tb-title"><b>The Street Book</b><small>Covenant Builders &middot; where the storm hit</small></div>
</div>

<div class="filters" id="filters"></div>

<div class="fabs">
  <button class="fab" id="layerbtn" onclick="toggleLayers()" title="Map type">&#9707;</button>
  <button class="fab" id="gpsfab" onclick="locateMe()" title="Where am I">&#10021;</button>
</div>

<div id="layers">
  <b>Map type</b>
  <button data-b="map" onclick="setBase('map')">Map</button>
  <button data-b="sat" onclick="setBase('sat')">Satellite</button>
  <button data-b="hyb" onclick="setBase('hyb')">Satellite + street names</button>
  <button data-b="naip" onclick="setBase('naip')">Aerial photo (USGS)</button>
</div>

<div id="sheet">
  <div id="grab"><i></i></div>
  <div id="sheethead"></div>
  <div id="sheetbody"></div>
</div>

<div id="print"></div>

   {t:'Valkaria was supposed to be “Valkyries.” Ernest Svedelius settled north of Grant in 1886 and named it for the Norse figures; the post office misspelled it and the mistake became the name.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'Grant got its post office on 4 August 1891 under postmaster Edwin Nelson, its first school in 1893, and its first train that November. Grant Grocery opened in 1894 and is on the National Register of Historic Places.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'Palm Bay was Tillman until 1925. John Tillman built a wharf at the mouth of Turkey Creek in the late 1870s; the post office opened in 1885; residents renamed the place Palm Bay in the land boom for a palm-lined cove on the lagoon.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'In 1959 the Mackle brothers’ General Development Corporation bought about 41,000 acres west of the Indian River for $1.7 million, platted it as Port Malabar, and sold it by mail — ten dollars down, ten dollars a month, a quarter-acre of Florida. They drained 40,000 acres of swamp and dug 180 miles of canals. GDC filed Chapter 11 in 1990 and three executives were convicted of fraud.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'Bayside Lakes, in the late 1990s, was the first big development in Palm Bay that was not GDC.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'Barefoot Bay is the largest manufactured-home community in Florida — deed restricted, unincorporated, mostly retired, and it runs its own recreation district and its own water and sewer district.', s:'https://en.wikipedia.org/wiki/Barefoot_Bay,_Florida', sn:'Barefoot Bay, Florida'}
  ],
  legends:[
   {t:'LEGEND — the Ais. The people who lived on Turkey Creek for centuries before Ponce de León were gone by about 1760, taken by disease and raids. Their shell mounds are still along the lagoon, and every few years somebody in Palm Bay digs a pool and finds one.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'},
   {t:'LEGEND — the ten-dollar lot. Half the retirees in Port Malabar will tell you their parents bought the lot sight unseen from a magazine ad, then flew down to find it under two feet of water. The mail-order sales and the draining are documented; the family version is always better.', s:'https://oldpalmbay.com/', sn:'Old Palm Bay'}
  ],
  heroes:[
   {t:'Paul Kroegel — a German-born boat builder from Sebastian who guarded the pelicans on Pelican Island himself, until Theodore Roosevelt made it the first national wildlife refuge in the country on 14 March 1903 and Kroegel became its first warden. Every national wildlife refuge in America started twelve miles from where you are standing.', s:'https://myfloridahistory.org/date-in-history/march-14-1903/pelican-island-national-wildlife-became-first-national-refuge', sn:'Florida Historical Society'},
   {t:'The Bensen and Christensen families — Danish immigrants who fished and farmed Grant in the 1800s. Atley Bensen built a precut yellow-pine cracker house in 1916; the family gave it to the historical society in 1984 and it has been a museum since 1987. Both names are still common on these mailboxes.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'The Grant Seafood Festival volunteers — the longest-running seafood festival on the East Coast, run entirely by volunteers, and the money goes to a scholarship fund. In Grant, “are you working the festival” is a real question.', s:'https://www.grantseafoodfestival.com/information', sn:'Grant Seafood Festival'}
  ],
  landmarks:[
   {t:'Malabar Scrub Sanctuary — county EEL preserve, trails, the scrub jays.', s:'https://www.brevardfl.gov/EELProgram/Sanctuaries/MalabarScrubSanctuary', sn:'Brevard County EEL'},
   {t:'Turkey Creek Sanctuary, Palm Bay — 113 acres, 1.85 miles of boardwalk, given to Audubon and the city in 1978; the Margaret Hames Nature Center opened in 1992.', s:'https://en.wikipedia.org/wiki/Turkey_Creek_Sanctuary', sn:'Turkey Creek Sanctuary'},
   {t:'Grant Historical House — the 1916 Bensen house, open as a museum.', s:'https://www.grantvalkaria.org/community/page/history', sn:'Town of Grant-Valkaria'},
   {t:'The Grant Seafood Festival — every spring, and the whole town works it.', s:'https://www.grantseafoodfestival.com/information', sn:'Grant Seafood Festival'}
  ],
  openers:[

   'Palm Bay: “Was this one of the old Port Malabar lots? I keep hearing about ten dollars down, ten dollars a month.”',
   'Grant: “Do you work the seafood festival, or do you leave town that weekend?”',

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.js"></script>
<script>
/* ============================================================
   Sources. All open access — no key, no account, no bill.
   ============================================================ */
var FDOR    = 'https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest/services/Florida_Statewide_Cadastral/FeatureServer/0/query';
var NAIP    = 'https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPPlus/ImageServer/exportImage';
var STREETS = 'https://tiles.openfreemap.org/styles/liberty';   /* OpenStreetMap data, free, no key */
var ESRI    = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
var ESRILAB = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';

var S = { mode:'overview', area:'all', base:'map', route:null, doors:[], blocks:[], bi:0,
          map:null, geo:null, styled:false, me:null, tab:'doors', snap:'half' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function qs(o){ var a=[]; for(var k in o){ a.push(encodeURIComponent(k)+'='+encodeURIComponent(o[k])); } return a.join('&'); }
function daysLeft(iso){
  var loss = new Date(iso+'T12:00:00'), end = new Date(loss.getTime());
  end.setFullYear(end.getFullYear()+1);
  return Math.round((end - new Date())/86400000);
}
function era(y){ if(!y || y<1900 || y>=2015) return 3; if(y>=2000) return 2; if(y>=1980) return 1; return 0; }
var ERA_COLOR = ['#c1524a','#d4a24c','#c4a574','#9aa3b8'];
var ERA_NAME  = ['Before 1980','1980–1999','2000–2014','2015 or newer'];

/* ---------- the county records ---------- */
function fetchParcels(r){
  var b = [r.center[1]-r.d, r.center[0]-r.d, r.center[1]+r.d, r.center[0]+r.d].join(',');
  var url = FDOR + '?' + qs({
    f:'json', where:"DOR_UC IN ('001','002')", geometry:b, geometryType:'esriGeometryEnvelope',
    inSR:'4326', spatialRel:'esriSpatialRelIntersects',
    outFields:'PARCEL_ID,PHY_ADDR1,PHY_CITY,PHY_ZIPCD,ACT_YR_BLT,EFF_YR_BLT,JV,TOT_LVG_AR,OWN_NAME,DOR_UC',
    returnCentroid:'true', returnGeometry:'false', outSR:'4326', resultRecordCount:'2000'
  });
  return fetch(url).then(function(x){ return x.json(); }).then(function(j){
    if(j.error) throw new Error(j.error.message||'record service error');
    return (j.features||[]).map(function(f){
      var a=f.attributes, c=f.centroid||{};
      return { id:a.PARCEL_ID, ad:(a.PHY_ADDR1||'').trim(), city:(a.PHY_CITY||'').trim(),
               zip:(a.PHY_ZIPCD||''), yr:a.ACT_YR_BLT||a.EFF_YR_BLT||0, jv:a.JV||0,
               sf:a.TOT_LVG_AR||0, own:(a.OWN_NAME||'').trim(), lat:c.y, lon:c.x };
    }).filter(function(p){ return p.lat && p.ad; });
  });
}
function cacheGet(id){
  try{ var v = JSON.parse(localStorage.getItem('sb:p:'+id)||'null');
       if(v && (Date.now()-v.t) < 30*86400000) return v.rows; }catch(e){}
  return null;
}
function cacheSet(id, rows){ try{ localStorage.setItem('sb:p:'+id, JSON.stringify({t:Date.now(), rows:rows})); }catch(e){} }

/* ---------- the walk: streets in order, chained corner to corner ---------- */
function orderDoors(rows, r){
  var groups = [];
  r.streets.forEach(function(st){
    var on = rows.filter(function(p){
      var a = p.ad.toUpperCase(), i = a.indexOf(' ');
      return i > -1 && a.slice(i+1) === st;
    });
    if(!on.length) return;
    on.sort(function(a,b){ return (parseInt(a.ad,10)||0) - (parseInt(b.ad,10)||0); });
    groups.push(on);
  });
  if(!groups.length) return [];
  var far = function(a,b){ var dx=(a.lat-b.lat)*111, dy=(a.lon-b.lon)*98; return dx*dx+dy*dy; };
  var out = groups.shift(), left = groups;
  while(left.length){
    var end = out[out.length-1], bi = 0, bd = Infinity, flip = false;
    left.forEach(function(g, i){
      var d1 = far(end, g[0]), d2 = far(end, g[g.length-1]), d = Math.min(d1, d2);
      if(d < bd){ bd = d; bi = i; flip = d2 < d1; }
    });
    var g = left.splice(bi,1)[0];
    if(flip) g.reverse();
    out = out.concat(g);
  }
  return out;
}

/* ---------- blocks: one afternoon at this street's pace ---------- */
var HOURS = 4;
function blockTarget(r){ return Math.round((r.pace||13) * HOURS); }
function makeBlocks(d, target){
  if(d.length <= target*1.25) return [d];
  var n = Math.ceil(d.length/target), size = Math.round(d.length/n);
  function stOf(p){ return p.ad.slice(p.ad.indexOf(' ')+1); }
  var corners = [];
  for(var i=1; i<d.length; i++){ if(stOf(d[i]) !== stOf(d[i-1])) corners.push(i); }
  var cuts = [], prev = 0;
  for(var j=1; j<n; j++){
    var ideal = Math.round(j*size), best = ideal, bd = size*0.35;
    corners.forEach(function(c){
      var gap = Math.abs(c-ideal);
      if(gap < bd && c > prev + size*0.4 && c < d.length - size*0.4){ bd = gap; best = c; }
    });
    if(best > prev){ cuts.push(best); prev = best; }
  }
  var out = [], from = 0;
  cuts.forEach(function(c){ out.push(d.slice(from,c)); from = c; });
  out.push(d.slice(from));
  return out.filter(function(b){ return b.length; });
}
function blockName(b){
  var a = b[0].ad.slice(b[0].ad.indexOf(' ')+1);
  var z = b[b.length-1].ad.slice(b[b.length-1].ad.indexOf(' ')+1);
  return a === z ? a : a + ' to ' + z;
}
function vis(){ return (S.blocks && S.blocks.length > 1) ? S.blocks[S.bi] : S.doors; }
function setBlock(i){
  S.bi = i;
  try{ localStorage.setItem('sb:b:'+S.route.id, i); }catch(e){}
  renderRoute(); paintMap();
  document.getElementById('sheetbody').scrollTop = 0;
}

/* ---------- marks ---------- */
function markOf(id, rid){ try{ return localStorage.getItem('sb:m:'+(rid||S.route.id)+':'+id)||''; }catch(e){ return ''; } }
function setMark(id, v){
  try{
    var k = 'sb:m:'+S.route.id+':'+id;
    if(markOf(id)===v) localStorage.removeItem(k); else localStorage.setItem(k, v);
  }catch(e){}
  renderRoute(); paintMap();
}

/* ---------- when it gets dark (USNO algorithm, no network) ---------- */
function sunsetAt(lat, lon, when){
  var rad = Math.PI/180, start = new Date(when.getFullYear(), 0, 0);
  var day = Math.floor((when - start)/86400000), lngHour = lon/15;
  var t = day + ((18 - lngHour)/24);
  var M = (0.9856*t) - 3.289;
  var L = M + (1.916*Math.sin(M*rad)) + (0.020*Math.sin(2*M*rad)) + 282.634; L = (L+360)%360;
  var RA = Math.atan(0.91764*Math.tan(L*rad))/rad; RA = (RA+360)%360;
  RA = (RA + (Math.floor(L/90)*90 - Math.floor(RA/90)*90))/15;
  var sinDec = 0.39782*Math.sin(L*rad), cosDec = Math.cos(Math.asin(sinDec));
  var cosH = (Math.cos(90.833*rad) - (sinDec*Math.sin(lat*rad))) / (cosDec*Math.cos(lat*rad));
  if(cosH > 1 || cosH < -1) return null;
  var H = (Math.acos(cosH)/rad)/15, T = H + RA - (0.06571*t) - 6.622;
  var UT = ((T - lngHour) % 24 + 24) % 24;
  var out = new Date(when.getTime());
  out.setUTCHours(Math.floor(UT), Math.round((UT % 1)*60), 0, 0);
  return out;
}
function clock(d){
  if(!d) return '—';
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'pm' : 'am';
  h = h % 12; if(!h) h = 12;
  return h + ':' + (m<10?'0':'') + m + ap;
}
function addMin(d, mins){ return new Date(d.getTime() + mins*60000); }
function miles(a, b){ var dx=(a[0]-b[0])*69, dy=(a[1]-b[1])*60.6; return Math.sqrt(dx*dx+dy*dy); }
function blockCentre(b){
  var la=0, lo=0, n=0;
  b.forEach(function(p){ if(p.lat){ la+=p.lat; lo+=p.lon; n++; } });
  return n ? [la/n, lo/n] : S.route.center;
}
function plan(b){
  var r = S.route, pace = r.pace || 13;
  var left = b.filter(function(p){ return !markOf(p.id); }).length;
  var now = new Date(), start = new Date(); start.setHours(15,30,0,0);
  if(now > start) start = new Date(Math.ceil(now.getTime()/300000)*300000);
  var dark = sunsetAt(r.center[0], r.center[1], new Date());
  var lastKnock = dark ? addMin(dark, -15) : null;
  var mins = Math.round(left/pace*60), end = addMin(start, mins);
  var road = miles(YARD, blockCentre(b)) * 1.3, drive = Math.round(road/45*60) + 8;
  return { pace:pace, left:left, start:start, dark:dark, lastKnock:lastKnock, mins:mins, end:end,
           road:road, drive:drive, fits: lastKnock ? end <= lastKnock : true,
           over: lastKnock ? Math.max(0, Math.round((end - lastKnock)/60000)) : 0 };
}

/* ---------- modes ---------- */
function goOverview(){
  S.mode = 'overview'; S.route = null; S.doors = []; S.blocks = []; S.bi = 0;
  document.getElementById('backbtn').style.display = 'none';
  document.getElementById('tb-title').innerHTML = '<b>The Street Book</b><small>Covenant Builders &middot; where the storm hit</small>';
  renderFilters(); renderOverview(); paintMap(); snap('half');
}
function focusRoute(id){
  S.route = ROUTES.filter(function(r){ return r.id===id; })[0];
  S.mode = 'route'; S.doors = []; S.blocks = []; S.bi = 0; S.tab = 'doors';
  var a = AREAS.filter(function(x){ return x.id===S.route.area; })[0];
  document.getElementById('backbtn').style.display = 'block';
  document.getElementById('tb-title').innerHTML =
    '<b>'+esc(S.route.name)+'</b><small>'+esc(S.route.town)+' &middot; '+daysLeft(a.loss)+' days to file</small>';
  if(S.map) S.map.flyTo({ center:[S.route.center[1], S.route.center[0]], zoom:14.5, duration:700 });
  snap('half');
  var cached = cacheGet(S.route.id);
  if(cached){ S.doors = orderDoors(cached, S.route); afterLoad(); }
  else { document.getElementById('sheetbody').innerHTML = '<div class="loading">Pulling the county records for these streets…</div>'; renderRouteHead(); }
  load();
}
function load(){
  fetchParcels(S.route).then(function(rows){
    cacheSet(S.route.id, rows);
    S.doors = orderDoors(rows, S.route);
    afterLoad();
  }).catch(function(e){
    if(!S.doors.length){
      document.getElementById('sheetbody').innerHTML =
        '<div class="warn"><b>The record service did not answer.</b><br>'+esc(e.message)+
        '<br><br>You need a signal the first time you open a route. After that it is saved on this phone.</div>'+
        '<button class="btn prime" onclick="load()">Try again</button>';
    }
  });
}
function reload(){ try{ localStorage.removeItem('sb:p:'+S.route.id); }catch(e){} load(); }
function afterLoad(){
  S.blocks = makeBlocks(S.doors, blockTarget(S.route));
  var want = 0;
  try{ want = parseInt(localStorage.getItem('sb:b:'+S.route.id),10) || 0; }catch(e){}
  S.bi = Math.max(0, Math.min(want, S.blocks.length-1));
  renderRoute(); paintMap();
}

/* ---------- the sheet slides like a maps app ---------- */
function snap(state){
  var el = document.getElementById('sheet');
  el.className = state === 'full' ? 'full' : (state === 'half' ? 'half' : '');
  S.snap = state;
}
function initSheet(){
  var el = document.getElementById('sheet'), grab = document.getElementById('grab');
  var y0 = null, t0 = 0;
  grab.addEventListener('pointerdown', function(e){ y0 = e.clientY; t0 = Date.now(); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointerup', function(e){
    if(y0 === null) return;
    var dy = e.clientY - y0, quick = (Date.now()-t0) < 400;
    y0 = null;
    if(dy < -30 || (quick && dy < -8)) snap(S.snap === 'half' ? 'full' : (S.snap === 'full' ? 'full' : 'half'));
    else if(dy > 30) snap(S.snap === 'full' ? 'half' : 'peek');
    else snap(S.snap === 'full' ? 'half' : 'full');
  });
}

/* ---------- the walk list, as a file ---------- */
function csvOf(rows, label){
  var out = ['Name,Address,City,Owner of record,Year built,Block,Status'];
  rows.forEach(function(p){
    var m = markOf(p.id);
    var st = m==='k' ? 'Knocked' : m==='n' ? 'Not home' : m==='l' ? 'LEAD' : '';
    out.push([p.ad, p.ad+', '+(p.city||'')+' FL '+(p.zip||''), p.city||'', p.own||'', p.yr||'', label, st]
      .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
  });
  return out.join('\n');
}
function downloadCsv(all){
  var rows = all ? S.doors : vis();
  var label = all ? S.route.name : 'Block '+(S.bi+1);
  var name = S.route.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + (all?'-all':'-block'+(S.bi+1)) + '.csv';
  var blob = new Blob([csvOf(rows, label)], { type:'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function copyLeads(){
  var out = [S.route.name+' — '+S.route.town+' — '+new Date().toDateString(), ''];
  S.doors.forEach(function(p){
    var m = markOf(p.id);
    if(!m) return;
    out.push((m==='k'?'KNOCKED':(m==='l'?'LEAD':'NOT HOME'))+'\t'+p.ad+'\t'+(p.own||'')+'\tbuilt '+(p.yr||''));
  });
  if(out.length===2) out.push('Nothing marked yet.');
  var t = out.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(t); alert('Copied. Paste it into the CRM or an email.'); }
  else prompt('Copy this:', t);
}
</script>
<script>
/* ============================================================
   The map — MapLibre GL over OpenStreetMap vector tiles.
   Open data, open engine, no key and no bill.
   ============================================================ */
var MARKERS = [];
function rasterStyle(tiles, attrib, labels){
  var st = { version:8, glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources:{ img:{ type:'raster', tiles:[tiles], tileSize:256, maxzoom:20, attribution:attrib } },
    layers:[{ id:'sat', type:'raster', source:'img' }] };
  if(labels){
    st.sources.lab = { type:'raster', tiles:[labels], tileSize:256, maxzoom:20 };
    st.layers.push({ id:'labels', type:'raster', source:'lab' });
  }
  return st;
}
function styleFor(k){
  if(k === 'sat')  return rasterStyle(ESRI, 'Imagery: Esri, Maxar, Earthstar');
  if(k === 'hyb')  return rasterStyle(ESRI, 'Imagery: Esri, Maxar, Earthstar', ESRILAB);
  if(k === 'naip') return rasterStyle(NAIP + '?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=jpgpng&f=image',
                                      'Aerial: USDA NAIP via USGS — public domain');
  return STREETS;
}
function setBase(k){
  S.base = k;
  try{ localStorage.setItem('sb:base', k); }catch(e){}
  var bs = document.querySelectorAll('#layers button');
  for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute('data-b')===k ? 'on' : '';
  document.getElementById('layers').style.display = 'none';
  if(S.map){ S.styled = false; S.map.setStyle(styleFor(k)); }
}
function toggleLayers(){
  var el = document.getElementById('layers');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function buildMap(){
  var want = 'map';
  try{ want = localStorage.getItem('sb:base') || 'map'; }catch(e){}
  S.base = want;
  S.map = new maplibregl.Map({
    container:'map', style:styleFor(want), center:[-80.60, 27.95], zoom:8.4,
    attributionControl:{ compact:true }, maxPitch:60
  });
  S.map.addControl(new maplibregl.NavigationControl({ showZoom:false, visualizePitch:true }), 'bottom-right');
  S.geo = new maplibregl.GeolocateControl({
    positionOptions:{ enableHighAccuracy:true }, trackUserLocation:true, showUserHeading:true, showAccuracyCircle:true
  });
  S.map.addControl(S.geo);
  S.geo.on('geolocate', function(pos){
    S.me = [pos.coords.latitude, pos.coords.longitude];
    document.getElementById('gpsfab').className = 'fab on';
    if(S.mode === 'route') renderRouteHead(); else renderOverview();
  });
  S.map.on('style.load', function(){ S.styled = true; addOverlays(); paintMap(); });
  S.map.on('click', 'doors', function(e){ doorPopup(e.features[0]); });
  S.map.on('mouseenter', 'doors', function(){ S.map.getCanvas().style.cursor = 'pointer'; });
  S.map.on('mouseleave', 'doors', function(){ S.map.getCanvas().style.cursor = ''; });
  var bs = document.querySelectorAll('#layers button');
  for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute('data-b')===want ? 'on' : '';
}
function locateMe(){ if(S.geo) S.geo.trigger(); }

/* empty sources + layers, rebuilt after every style change */
function addOverlays(){
  var m = S.map;
  if(!m.getSource('line')){
    m.addSource('line', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    m.addLayer({ id:'line-case', type:'line', source:'line',
      paint:{ 'line-color':'#12182B', 'line-width':6, 'line-opacity':.55 },
      layout:{ 'line-cap':'round', 'line-join':'round' } });
    m.addLayer({ id:'line-dash', type:'line', source:'line',
      paint:{ 'line-color':'#c4a574', 'line-width':2.5, 'line-dasharray':[2,2] },
      layout:{ 'line-cap':'round', 'line-join':'round' } });
  }
  if(!m.getSource('rings')){
    m.addSource('rings', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    m.addLayer({ id:'rings-fill', type:'fill', source:'rings',
      paint:{ 'fill-color':'#d4a24c', 'fill-opacity':.08 } });
    m.addLayer({ id:'rings-line', type:'line', source:'rings',
      paint:{ 'line-color':'#d4a24c', 'line-width':1, 'line-opacity':.6 } });
  }
  if(!m.getSource('doors')){
    m.addSource('doors', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    m.addLayer({ id:'doors', type:'circle', source:'doors', paint:{
      'circle-radius':['interpolate',['linear'],['zoom'], 13,3, 16,6, 19,11],
      'circle-color':['get','color'],
      'circle-stroke-width':['case',['==',['get','mark'],''],1.4,3],
      'circle-stroke-color':['match',['get','mark'],'k','#3f7d52','l','#12182B','n','#9aa3b8','#ffffff'],
      'circle-opacity':['case',['==',['get','mark'],'n'],.35,.95] } });
    m.addLayer({ id:'doorno', type:'symbol', source:'doors', minzoom:17.5, layout:{
      'text-field':['get','n'], 'text-size':10, 'text-offset':[0,-1.1], 'text-allow-overlap':false },
      paint:{ 'text-color':'#12182B', 'text-halo-color':'#fff', 'text-halo-width':1.4 } });
  }
}
function clearMarkers(){ MARKERS.forEach(function(m){ m.remove(); }); MARKERS = []; }
function pinEl(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstChild; }
function setData(id, data){ var s = S.map.getSource(id); if(s) s.setData(data); }
function fc(f){ return { type:'FeatureCollection', features:f }; }
function ring(lat, lon, miles){
  var pts = [], R = miles/69;
  for(var i=0;i<=48;i++){
    var a = i/48*2*Math.PI;
    pts.push([lon + R*Math.cos(a)/Math.cos(lat*Math.PI/180), lat + R*Math.sin(a)]);
  }
  return { type:'Feature', geometry:{ type:'Polygon', coordinates:[pts] }, properties:{} };
}
function fit(pts, pad){
  if(!pts.length) return;
  var w=180, s=90, e=-180, n=-90;
  pts.forEach(function(p){ w=Math.min(w,p[1]); e=Math.max(e,p[1]); s=Math.min(s,p[0]); n=Math.max(n,p[0]); });
  try{ S.map.fitBounds([[w,s],[e,n]], { padding:{ top:110, bottom:Math.round(window.innerHeight*0.46), left:40, right:40 }, duration:600, maxZoom:17.5 }); }catch(e){}
}

/* ---------- overview: every route on one map ---------- */
function paintOverview(){
  if(!S.styled) return;
  clearMarkers();
  setData('doors', fc([])); setData('line', fc([]));
  var pts = [], rings = [];
  AREAS.forEach(function(a){
    if(S.area !== 'all' && S.area !== a.id) return;
    a.reports.forEach(function(rep){
      pts.push([rep.lat, rep.lon]);
      rings.push(ring(rep.lat, rep.lon, 7));
      MARKERS.push(new maplibregl.Marker({ element: pinEl('<div class="stormpin">'+esc(rep.mag)+'</div>') })
        .setLngLat([rep.lon, rep.lat])
        .setPopup(new maplibregl.Popup({ offset:14 }).setHTML(
          '<b>'+esc(rep.mag)+' '+(rep.kind==='hail'?'hail':'wind')+'</b><br>'+esc(rep.t)+'<br>'+esc(rep.txt)))
        .addTo(S.map));
    });
  });
  setData('rings', fc(rings));
  ROUTES.forEach(function(r){
    if(S.area !== 'all' && S.area !== r.area) return;
    pts.push(r.center);
    var cached = cacheGet(r.id), d = cached ? orderDoors(cached, r) : [];
    var done = 0; d.forEach(function(p){ if(markOf(p.id, r.id)) done++; });
    var el = pinEl('<div class="pin'+(r.area==='fp'?' fp':'')+'">'+esc(r.name)+
      '<small>'+(d.length ? d.length+' doors'+(done?' &middot; '+done+' done':'') : 'tap to load')+'</small></div>');
    el.addEventListener('click', function(ev){ ev.stopPropagation(); focusRoute(r.id); });
    MARKERS.push(new maplibregl.Marker({ element:el }).setLngLat([r.center[1], r.center[0]]).addTo(S.map));
  });
  MARKERS.push(new maplibregl.Marker({ element: pinEl('<div class="yardpin">The yard &middot; Vero Beach</div>') })
    .setLngLat([YARD[1], YARD[0]]).addTo(S.map));
  pts.push(YARD);
  fit(pts);
}

/* ---------- one route ---------- */
function paintRoute(){
  if(!S.styled) return;
  clearMarkers();
  setData('rings', fc([]));
  var shown = vis(), pts = [], feats = [], line = [];
  var a = AREAS.filter(function(x){ return x.id===S.route.area; })[0];
  a.reports.forEach(function(rep){
    MARKERS.push(new maplibregl.Marker({ element: pinEl('<div class="stormpin">'+esc(rep.mag)+'</div>') })
      .setLngLat([rep.lon, rep.lat])
      .setPopup(new maplibregl.Popup({ offset:14 }).setHTML(
        '<b>'+esc(rep.mag)+' '+(rep.kind==='hail'?'hail':'wind')+'</b><br>'+esc(rep.t)+'<br>'+esc(rep.txt)))
      .addTo(S.map));
  });
  shown.forEach(function(p, i){
    if(!p.lat) return;
    pts.push([p.lat, p.lon]); line.push([p.lon, p.lat]);
    feats.push({ type:'Feature', geometry:{ type:'Point', coordinates:[p.lon, p.lat] },
      properties:{ id:p.id, n:String(i+1), ad:p.ad, own:p.own||'', yr:p.yr||0, sf:p.sf||0,
                   color:ERA_COLOR[era(p.yr)], mark:markOf(p.id) } });
  });
  setData('doors', fc(feats));
  setData('line', fc(line.length ? [{ type:'Feature', geometry:{ type:'LineString', coordinates:line }, properties:{} }] : []));
  fit(pts);
}
function doorPopup(f){
  var p = f.properties;
  new maplibregl.Popup({ offset:12 })
    .setLngLat(f.geometry.coordinates)
    .setHTML('<b>'+esc(p.ad)+'</b><br><span style="color:#5b667c">Door '+p.n+' of '+vis().length+
      (S.blocks.length>1 ? ' &middot; block '+(S.bi+1) : '')+'</span><br>'+
      'Built '+(p.yr||'—')+(p.sf?' &middot; '+p.sf+' sq ft':'')+'<br>Owner of record: '+esc(p.own||'—')+
      '<br><button class="btn" onclick="setMark(\''+p.id+'\',\'k\')">Knocked</button>'+
      '<button class="btn" onclick="setMark(\''+p.id+'\',\'n\')">Not home</button>'+
      '<button class="btn" onclick="setMark(\''+p.id+'\',\'l\')">Lead</button>')
    .addTo(S.map);
}
function paintMap(){ if(!S.map || !S.styled) return; if(S.mode==='route') paintRoute(); else paintOverview(); }

function nearestDoor(){
  if(!S.me || !S.doors.length) return null;
  var best=null, bd=1e9;
  vis().forEach(function(p,i){
    if(!p.lat) return;
    var dx=(p.lat-S.me[0])*364000, dy=(p.lon-S.me[1])*322000, d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){ bd=d; best={i:i, p:p, ft:Math.round(d)}; }
  });
  return best;
}
function openDrive(){
  var pts = vis().filter(function(p){ return p.lat; });
  if(!pts.length){ alert('No doors loaded yet.'); return; }
  var picks = [], step = Math.max(1, Math.floor(pts.length/8));
  for(var i=0; i<pts.length && picks.length<8; i+=step) picks.push(pts[i]);
  var dest = pts[pts.length-1];
  window.open('https://www.google.com/maps/dir/?' + qs({
    api:'1', destination: dest.lat+','+dest.lon, travelmode:'driving',
    waypoints: picks.map(function(p){ return p.lat+','+p.lon; }).join('|')
  }), '_blank', 'noopener');
}
</script>
<script>
/* ============================================================
   What the sheet says
   ============================================================ */
function renderFilters(){
  var h = '<button class="fchip'+(S.area==='all'?' on':'')+'" onclick="setArea(\'all\')">All 3 storms</button>';
  AREAS.forEach(function(a){
    h += '<button class="fchip'+(S.area===a.id?' on':'')+'" onclick="setArea(\''+a.id+'\')">'+esc(a.name)+'</button>';
  });
  document.getElementById('filters').innerHTML = h;
}
function setArea(id){ S.area = id; renderFilters(); renderOverview(); paintMap(); }

/* ---------- overview sheet: the routes, nearest first ---------- */
function renderOverview(){
  var from = S.me || YARD, list = ROUTES.filter(function(r){ return S.area==='all' || S.area===r.area; });
  list = list.map(function(r){ return { r:r, mi: miles(from, r.center)*1.3 }; })
             .sort(function(a,b){ return a.mi - b.mi; });
  var totalDoors = 0, totalMarks = 0;
  ROUTES.forEach(function(r){
    var c = cacheGet(r.id);
    if(!c) return;
    var d = orderDoors(c, r);
    totalDoors += d.length;
    d.forEach(function(p){ if(markOf(p.id, r.id)) totalMarks++; });
  });

  document.getElementById('sheethead').innerHTML =
    '<h2 class="big">Where the storm hit</h2>'+
    '<p class="sub">Ten walks across three storms. '+
    (totalDoors ? totalDoors+' doors loaded, '+totalMarks+' marked.' : 'Tap a route to pull its doors.')+'</p>';

  var h = '';
  list.forEach(function(x){
    var r = x.r, a = AREAS.filter(function(y){ return y.id===r.area; })[0];
    var c = cacheGet(r.id), n = c ? orderDoors(c, r).length : 0;
    var blocks = n ? makeBlocks(orderDoors(c, r), blockTarget(r)).length : 0;
    var done = 0;
    if(c) orderDoors(c, r).forEach(function(p){ if(markOf(p.id, r.id)) done++; });
    h += '<button class="rowbtn" onclick="focusRoute(\''+r.id+'\')">'+
      '<span class="rowdot" style="background:'+(r.area==='fp'?'#6b4f2a':(r.area==='hail'?'#12182B':'#3d4a6b'))+'">'+
        Math.round(x.mi)+'<span style="font-size:8px">mi</span></span>'+
      '<span class="rowtxt"><b>'+esc(r.name)+'</b>'+
      '<small>'+esc(r.town)+' &middot; '+(n ? n+' doors &middot; '+blocks+' afternoon'+(blocks>1?'s':'')+(done?' &middot; '+done+' marked':'') : 'tap to load')+
      ' &middot; '+daysLeft(a.loss)+'d to file</small></span>'+
      '<span class="rowgo">&rsaquo;</span></button>';
  });
  h += '<h3 class="sec">Before you knock</h3>'+
    '<div class="warn"><b>Florida wants a permit for cold doors.</b> A “home solicitation sale” needs a permit from the <b>Clerk of Court in that county</b> — F.S. 501.022. Brevard charges $100 plus a $24 background check and takes fingerprints. Contractors are not on the exemption list. <b>Invited visits are.</b></div>'+
    '<ul>'+
    '<li><b>You cannot sign a roof.</b> F.S. 489.113(3) makes a Certified Building Contractor subcontract roofing, and there is no approved roofer on the bench yet.</li>'+
    '<li><b>Never say “you have damage”</b> before you have been on the roof, and never say what insurance will cover. The carrier decides.</li>'+
    '<li><b>F.S. 489.147</b> — no paying or waiving deductibles, no gifts for signing, no referral money, no reading the policy for them.</li>'+
    '</ul>'+
    '<p class="src">Map: OpenStreetMap and CARTO · Imagery: Esri and USDA NAIP via USGS · Property records: Florida Department of Revenue 2025 tax roll · Storms: NWS local storm reports. All open access — no account, no key, no bill.</p>'+
    '<p class="src"><b>Covenant Builders</b> · CBC1253676 · (772) 473-7115 · Hablamos español.</p>';
  document.getElementById('sheetbody').innerHTML = h;
}

/* ---------- route sheet ---------- */
function renderRouteHead(){
  var r = S.route, d = vis(), near = nearestDoor();
  var h = '<h2 class="big">'+esc(r.name)+'</h2>'+
    '<p class="sub">'+esc(r.town)+(S.blocks.length>1 ? ' · block '+(S.bi+1)+' of '+S.blocks.length : '')+
    (d.length ? ' · '+d.length+' doors' : '')+
    (near ? ' · nearest door '+(near.i+1)+', '+near.ft+' ft' : '')+'</p>'+
    '<div class="tabs">'+
      '<button class="tab'+(S.tab==='doors'?' on':'')+'" data-p="doors" onclick="setTab(\'doors\')">Doors</button>'+
      '<button class="tab'+(S.tab==='area'?' on':'')+'" data-p="area" onclick="setTab(\'area\')">The area</button>'+
      '<button class="tab'+(S.tab==='say'?' on':'')+'" data-p="say" onclick="setTab(\'say\')">What to say</button>'+
    '</div>';
  document.getElementById('sheethead').innerHTML = h;
}
function setTab(t){ S.tab = t; renderRoute(); document.getElementById('sheetbody').scrollTop = 0; snap('full'); }
function renderRoute(){
  renderRouteHead();
  var el = document.getElementById('sheetbody');
  if(S.tab === 'area'){ el.innerHTML = areaHtml(); return; }
  if(S.tab === 'say'){ el.innerHTML = sayHtml(); return; }
  if(!S.doors.length){ el.innerHTML = '<div class="loading">Pulling the county records for these streets…</div>'; return; }

  var r = S.route, d = vis(), pl = plan(d);
  var yrs = d.map(function(p){ return p.yr; }).filter(function(y){ return y>1900; }).sort();
  var med = yrs.length ? yrs[Math.floor(yrs.length/2)] : 0;
  var jvs = d.map(function(p){ return p.jv; }).filter(function(v){ return v>0; }).sort(function(a,b){return a-b;});
  var mjv = jvs.length ? jvs[Math.floor(jvs.length/2)] : 0;
  var k=0,n=0; d.forEach(function(p){ var m=markOf(p.id); if(m==='k')k++; if(m==='n')n++; });

  var h = '<button class="btn sand" onclick="openDrive()">Drive it in Google Maps</button>'+
          '<button class="btn" onclick="printSheet(false)">Print this block</button>'+
          '<button class="btn" onclick="printSheet(true)">Print every block</button>'+
          '<button class="btn" onclick="downloadCsv(false)">Walk list file (CSV)</button>';

  if(S.blocks.length > 1){
    var walked = 0; S.doors.forEach(function(p){ if(markOf(p.id)) walked++; });
    h += '<h3 class="sec">Afternoons on this route</h3>'+
         '<p class="note">'+S.doors.length+' doors, cut into '+S.blocks.length+' blocks. A block is one afternoon at this street’s pace — about '+
         pl.pace+' doors an hour here. '+esc(r.paceWhy||'')+' '+walked+' of '+S.doors.length+' marked so far.</p><div class="chips">';
    S.blocks.forEach(function(b,i){
      var done=0; b.forEach(function(p){ if(markOf(p.id)) done++; });
      h += '<button class="chip'+(i===S.bi?' hot':'')+'" style="cursor:pointer" onclick="setBlock('+i+')">'+
           (i===S.bi?'▸ ':'')+'Block '+(i+1)+' · '+b.length+(done?' · '+done+' done':'')+'</button>';
    });
    h += '</div>';
  }
  h += '<div class="plan"><b>Block '+(S.bi+1)+(S.blocks.length>1?' of '+S.blocks.length:'')+
       (S.blocks.length>1?' — '+esc(blockName(d)):'')+'</b><br>'+
       'Leave the yard about <b>'+clock(addMin(pl.start, -pl.drive))+'</b> — '+Math.round(pl.road)+' road miles, call it '+pl.drive+' minutes.<br>'+
       'Knock <b>'+clock(pl.start)+'</b> to <b>'+clock(pl.end)+'</b> for the '+pl.left+' doors still unmarked, at '+pl.pace+' an hour.<br>'+
       'Sun down <b>'+clock(pl.dark)+'</b> · last knock <b>'+clock(pl.lastKnock)+'</b>. Halfway by <b>'+clock(addMin(pl.start, Math.round(pl.mins/2)))+'</b>.<br>'+
       (pl.fits ? 'This block fits the daylight.' :
        '<b style="color:#8d3b35">This block runs '+pl.over+' minutes past dark.</b> Take what you get and finish it next time.')+
       '</div>'+
       '<p class="note">Those times are a <b>model</b>, not a measurement — nobody has timed a Covenant door yet. Walk one block, tell me the real number, and every plan here gets honest.</p>';

  h += '<div class="plan" style="background:#f5f6f8;border-color:#e3e6ec"><b>Why this street.</b> '+esc(r.why)+
       '<br><br><b>Parking.</b> '+r.park+'</div>';

  h += '<div class="chips">'+
       '<span class="chip">'+d.length+' doors'+(S.blocks.length>1?' in this block':'')+'</span>'+
       '<span class="chip">median built '+(med||'—')+'</span>'+
       '<span class="chip">typical value $'+(mjv?mjv.toLocaleString():'—')+'</span>'+
       '<span class="chip hot">'+k+' knocked</span><span class="chip">'+n+' not home</span></div>'+
       '<div class="legend">';
  ERA_NAME.forEach(function(nm,i){ h += '<span><i class="dot" style="background:'+ERA_COLOR[i]+'"></i>'+nm+'</span>'; });
  h += '</div><p class="note">Owner and year come from the Florida Department of Revenue 2025 tax roll — public record. It is the age of the <b>house</b>, not the roof. Use it to pick a street, never to tell a homeowner what they have.</p>';

  var last = '';
  d.forEach(function(p,i){
    var stName = p.ad.slice(p.ad.indexOf(' ')+1);
    if(stName !== last){ h += '<h3 class="sec">'+esc(stName)+'</h3>'; last = stName; }
    var m = markOf(p.id), e = era(p.yr);
    h += '<div class="door"><span class="n">'+(i+1)+'</span>'+
      '<span class="ad"><b>'+esc(p.ad)+'</b><small>'+esc(p.own||'—')+(p.sf?' · '+p.sf+' sq ft':'')+'</small></span>'+
      '<span class="yr y'+e+'">'+(p.yr||'—')+'</span>'+
      '<span class="mk">'+
        '<button class="'+(m==='k'?'on':'')+'" title="Knocked" onclick="setMark(\''+p.id+'\',\'k\')">K</button>'+
        '<button class="'+(m==='n'?'on':'')+'" title="Nobody home" onclick="setMark(\''+p.id+'\',\'n\')">—</button>'+
        '<button class="'+(m==='l'?'on':'')+'" title="Lead" onclick="setMark(\''+p.id+'\',\'l\')">L</button>'+
      '</span></div>';
  });
  h += '<p class="note">K = somebody answered. — = nobody home, leave the card. L = a name and a number; that one becomes a CRM row inside two days.</p>'+
       '<button class="btn prime" onclick="copyLeads()">Copy the leads and the knocks</button>'+
       '<button class="btn" onclick="downloadCsv(true)">Whole route as a file</button>'+
       '<button class="btn" onclick="reload()">Refresh records</button>';
  el.innerHTML = h;
}

/* ---------- the area, the legends, the heroes ---------- */
function block(title, rows){
  if(!rows || !rows.length) return '';
  var h = '<h3 class="sec">'+title+'</h3>';
  rows.forEach(function(x){
    h += '<p>'+x.t+' <span class="src">— <a href="'+x.s+'" target="_blank" rel="noopener">'+esc(x.sn)+'</a></span></p>';
  });
  return h;
}
function areaHtml(){
  var a = AREAS.filter(function(x){ return x.id===S.route.area; })[0], c = CONTENT[a.id];
  var h = '<h3 class="sec">'+esc(a.name)+' · '+esc(a.when)+'</h3><p>'+esc(a.blurb)+'</p>';
  h += '<h3 class="sec">What the weather service was told</h3>';
  a.reports.forEach(function(r){ h += '<p><b>'+esc(r.mag)+'</b> · '+esc(r.t)+' — '+esc(r.txt)+'</p>'; });
  h += '<p class="src">NWS Local Storm Reports via the Iowa Environmental Mesonet archive, read 11 September 2026.</p>';
  return h + block('The history', c.history) + block('The legends', c.legends) +
         block('The local heroes', c.heroes) + block('What everybody knows', c.landmarks);
}
function sayHtml(){
  var a = AREAS.filter(function(x){ return x.id===S.route.area; })[0], c = CONTENT[a.id];
  var h = '<h3 class="sec">The knock</h3><ul>';
  SCRIPT_RULES.open.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul><h3 class="sec">Openers that belong to this town</h3><ul>';
  c.openers.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; });
  h += '</ul><p class="note">Use one, then shut up. A local line works because it is true and it is theirs, not because it is clever.</p>';
  h += '<div class="warn"><b>Never, on any door</b><ul>';
  SCRIPT_RULES.never.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul></div><h3 class="sec">En español</h3><ul>';
  SCRIPT_RULES.spanish.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; });
  h += '</ul><h3 class="sec">When you walk away</h3><ul>';
  SCRIPT_RULES.after.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul><div class="warn"><b>The permit.</b> Knocking a cold door to sell work is a “home solicitation sale”. The permit comes from the <b>Clerk of Court in that county</b> — Brevard for every route but Fort Pierce, St. Lucie for that one — and a contractor is not on the exemption list. An invited visit is.<br><span class="src"><a href="http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0501/Sections/0501.022.html" target="_blank" rel="noopener">F.S. 501.022</a> · <a href="https://www.brevardclerk.us/home-solicitation-permit" target="_blank" rel="noopener">Brevard Clerk</a></span></div>';
  return h;
}

/* ---------- paper ---------- */
function sheetFor(b, i){
  var r = S.route, a = AREAS.filter(function(x){ return x.id===r.area; })[0], pl = plan(b);
  var h = '<div class="pg"><h2>'+esc(r.name)+' — '+esc(r.town)+
    (S.blocks.length>1 ? ' — block '+(i+1)+' of '+S.blocks.length : '')+'</h2>'+
    '<p class="pl">'+esc(a.name)+' · '+esc(a.when)+' · '+daysLeft(a.loss)+' days left to file · '+
    b.length+' doors · '+pl.pace+' an hour · knock '+clock(pl.start)+' to '+clock(pl.end)+' · dark at '+clock(pl.dark)+'</p>'+
    '<p class="pl">Covenant Builders · CBC1253676 · (772) 473-7115 · never say a roof has damage before you have been on it · the carrier decides the claim</p>'+
    '<table class="sheet"><tr><th>#</th><th>Address</th><th>Owner of record</th><th>Built</th><th>Knock</th><th>Out</th><th>Name / number / notes</th></tr>';
  b.forEach(function(p,j){
    h += '<tr><td>'+(j+1)+'</td><td>'+esc(p.ad)+'</td><td>'+esc(p.own||'')+'</td><td>'+(p.yr||'')+'</td><td></td><td></td><td></td></tr>';
  });
  return h + '</table><p class="pl">Owner and year: Florida Dept. of Revenue 2025 tax roll. House age, not roof age.</p></div>';
}
function renderPrint(all){
  var out = '';
  if(all && S.blocks.length > 1) S.blocks.forEach(function(b,i){ out += sheetFor(b,i); });
  else out = sheetFor(vis(), S.bi);
  document.getElementById('print').innerHTML = out;
}
function printSheet(all){ renderPrint(all); window.print(); }

/* ---------- go ---------- */
buildMap();
initSheet();
goOverview();
</script>
